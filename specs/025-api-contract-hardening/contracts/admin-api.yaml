name: admin-api
version: "1.0.0"
provider: admin-api
consumers:
  - admin-web
base_path: /api
interactions:
  # ════════════════════════════════════════════════════════════════════════
  # 认证（auth）
  # ════════════════════════════════════════════════════════════════════════
  - id: auth_login
    method: POST
    path: /auth/login
    summary: 管理员登录（admin-web 登录页）
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          token: {type: str}
          profile.name: {type: str}
          profile.roleName: {type: str}
          profile.orgName: {type: str}
          profile.tenantId: {type: str, required: false}
          requiresTenantSelection: {type: bool, required: false}
          challengeToken: {type: str, required: false}
          candidates: {type: array, item: object}
          candidates[].tenantId: {type: str}
          candidates[].orgName: {type: str}
          candidates[].roleName: {type: str}
          candidates[].displayName: {type: str}
          candidates[].username: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/auth.ts login() / LoginResponse、
          TenantSelectionResponse；apps/admin-web/src/stores/auth.ts
          useAuthStore.login() 读取 token / profile 并持久化到 localStorage。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 422
        error_codes: [api.validation_error]
    notes: 管理员登录；用户名/密码错误→401，缺参→422

  - id: auth_sso_exchange
    method: POST
    path: /auth/sso/exchange
    summary: SSO 换票（022 FR-14，令牌走 POST 不再出现在 URL）
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          code: {type: int}
          message: {type: str, required: false}
          data.accessToken: {type: str}
          data.expiresAt: {type: int}
          data.sessionId: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/auth.ts exchangeSsoToken()（校验 code !== 0
          时抛错，读取 data.accessToken）；apps/admin-web/src/stores/auth.ts
          initializeSession() 消费 ssoToken 换票。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 422
        error_codes: [api.validation_error]
    notes: SSO 令牌换管理端 accessToken

  - id: auth_me
    method: GET
    path: /auth/me
    summary: 获取当前管理员档案
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          name: {type: str}
          roleName: {type: str}
          orgName: {type: str}
          username: {type: str, required: false}
          email: {type: str, required: false}
          phone: {type: str, required: false}
          avatarUrl: {type: str, required: false}
          avatarUpdatedAt: {type: str, required: false}
          lastLoginAt: {type: str, required: false}
          tenantId: {type: str, required: false}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/auth.ts fetchCurrentProfile()；apps/admin-web/src/stores/auth.ts
          AdminProfile 接口 + initializeSession() setProfile() 逐字段赋值。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
    notes: 当前管理员信息；token 失效→401，权限受限→403

  - id: skills_list
    method: GET
    path: /skills
    summary: 列出 Skill（admin-web SkillsPage）
    query:
      keyword: {type: str, required: false}
      type: {type: str, required: false}
      enabled: {type: bool, required: false}
      page: {type: int, required: false}
      page_size: {type: int, required: false}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          data: {type: array, item: object}
          data[].id: {type: str}
          data[].name: {type: str}
          data[].description: {type: str}
          data[].scenario: {type: str}
          data[].type: {type: str}
          data[].enabled: {type: bool}
          data[].updatedAt: {type: str}
          data[].lifecycle.publicationStatus: {type: str, required: false}
          data[].lifecycle.publishedVersion: {type: str, required: false}
          total: {type: int}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/skills.ts fetchSkills()（SkillItem 类型含
          id/name/scenario/type/enabled/updatedAt/lifecycle/package）；
          apps/admin-web/src/views/skills/SkillsPage.vue 列表渲染与启用开关读取
          row.enabled、row.lifecycle.publicationStatus。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
    notes: Skill 列表（含启用态与发布态标记）

  - id: skills_detail
    method: GET
    path: /skills/{skill_id}
    summary: Skill 详情
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          description: {type: str}
          scenario: {type: str}
          type: {type: str}
          config: {type: object}
          enabled: {type: bool}
          updatedAt: {type: str}
          lifecycle.publicationStatus: {type: str, required: false}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/skills.ts fetchSkill()；
          apps/admin-web/src/views/skills/SkillConfigPage.vue 编辑页按 id 加载并
          回填 config / lifecycle。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
    notes: Skill 详情；L1 资产对非 owner 以 404 隐藏存在性（036 FR-014）

  - id: skills_create
    method: POST
    path: /skills
    summary: 创建 Skill
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 201
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          description: {type: str}
          scenario: {type: str}
          type: {type: str}
          enabled: {type: bool}
          updatedAt: {type: str}
        error_codes: []
        notes: 来源 apps/admin-web/src/api/skills.ts createSkill()（SkillPayload）。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 409
        error_codes: [api.conflict]
      - status: 422
        error_codes: [api.validation_error]
    notes: 新建 Skill；重名/唯一约束冲突→409

  - id: skills_update
    method: PUT
    path: /skills/{skill_id}
    summary: 更新 Skill
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          description: {type: str}
          scenario: {type: str}
          type: {type: str}
          enabled: {type: bool}
          updatedAt: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/skills.ts updateSkill()；SkillConfigPage.vue
          保存后以返回 id 刷新列表。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
      - status: 422
        error_codes: [api.validation_error]
    notes: 编辑 Skill

  - id: skills_delete
    method: DELETE
    path: /skills/{skill_id}
    summary: 删除 Skill
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
        error_codes: []
        notes: 来源 apps/admin-web/src/api/skills.ts deleteSkill()（返回 { id }）。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
    notes: 删除 Skill

  - id: skills_enabled
    method: PATCH
    path: /skills/{skill_id}/enabled
    summary: 启用 / 停用 Skill
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          enabled: {type: bool}
          updatedAt: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/skills.ts setSkillEnabled()；SkillsPage.vue
          启用开关读取返回 enabled 回写行。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
      - status: 409
        error_codes: [api.conflict]
    notes: 启用前需已发布（draft 未发布→409）
  - id: skills_publish
    method: POST
    path: /skills/{skill_id}/publish
    summary: 发布 Skill（skill_lifecycle）
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          skill.id: {type: str}
          skill.enabled: {type: bool, required: false}
          release.id: {type: str}
          release.version: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/skills.ts publishSkill()（返回
          { skill, release: { id, version } }）；apps/admin-web/src/views/skills/
          SkillPublishDialog.vue 发布后跳转。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
      - status: 422
        error_codes: [api.validation_error]
    notes: 发布（生成 release 版本）

  # ════════════════════════════════════════════════════════════════════════
  # Tools（外部工具 CRUD）
  # ════════════════════════════════════════════════════════════════════════
  - id: tools_list
    method: GET
    path: /tools
    summary: 列出外部工具
    query:
      keyword: {type: str, required: false}
      type: {type: str, required: false}
      status: {type: str, required: false}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          type: {type: str}
          description: {type: str}
          status: {type: str}
          tags: {type: array, item: str}
          config: {type: object}
          lastTestStatus: {type: str, required: false}
          updatedAt: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/tools.ts fetchTools()（ExternalToolItem）；
          apps/admin-web/src/views/tools/ToolsPage.vue 列表读取
          row.status / row.lastTestStatus / row.config。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
    notes: 工具列表

  - id: tools_detail
    method: GET
    path: /tools/{tool_id}
    summary: 工具详情
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          type: {type: str}
          description: {type: str}
          usageHint: {type: str}
          status: {type: str}
          config: {type: object}
          tags: {type: array, item: str}
          lastTestStatus: {type: str, required: false}
          lastTestMessage: {type: str, required: false}
          updatedAt: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/tools.ts fetchTool()；
          apps/admin-web/src/views/tools/ToolEditPage.vue 编辑页回填
          form.config / form.tags / form.status。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
    notes: 工具详情

  - id: tools_create
    method: POST
    path: /tools
    summary: 创建外部工具
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 201
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          type: {type: str}
          status: {type: str}
          config: {type: object}
          updatedAt: {type: str}
        error_codes: []
        notes: 来源 apps/admin-web/src/api/tools.ts createTool()（ToolPayload）。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
    notes: 新建工具

  - id: tools_test
    method: POST
    path: /tools/{tool_id}/test
    summary: 测试工具连接
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          success: {type: bool, required: false}
          message: {type: str, required: false}
          result: {type: object, required: false}
          data: {type: object, required: false}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/tools.ts testTool() 返回 Record<string, any>，
          ToolEditPage.vue「测试」按钮读取返回体任意键（success/message/result/data
          均可能，字段名不稳定）。消费方未区分具体键，字段列表仅为已消费到的常见键。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
      - status: 422
        error_codes: [api.validation_error]
    notes: 工具连通性测试（返回体结构不稳定，见 gap G1）

  # ════════════════════════════════════════════════════════════════════════
  # Models（模型提供商 / 实例）
  # ════════════════════════════════════════════════════════════════════════
  - id: models_providers
    method: GET
    path: /models/providers
    summary: 模型提供商列表
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          code: {type: str}
          providerType: {type: str}
          defaultBaseUrl: {type: str}
          status: {type: str}
          updatedAt: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/models.ts fetchModelProviders()
          （ModelProviderItem）；apps/admin-web/src/views/models/ModelsPage.vue
          与 components/models/ModelCapabilitySelect.vue 消费。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
    notes: 提供商列表

  - id: models_instances
    method: GET
    path: /models/instances
    summary: 模型实例列表
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          tenantId: {type: str}
          providerId: {type: str}
          providerName: {type: str}
          providerCode: {type: str}
          displayName: {type: str}
          modelName: {type: str}
          baseUrl: {type: str}
          apiVersion: {type: str}
          apiKeyMasked: {type: str}
          capabilities: {type: array, item: str}
          runtimeKind: {type: str}
          maxContextTokens: {type: int}
          status: {type: str}
          healthStatus: {type: str}
          lastError: {type: str, required: false}
          isDefault: {type: bool}
          priority: {type: int}
          updatedAt: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/models.ts fetchModelInstances()
          （ModelInstanceItem）；ModelsPage.vue 列表读取 healthStatus / isDefault /
          capabilities；ModelCapabilitySelect.vue 过滤 status==='active' 且
          capabilities 含目标能力。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
    notes: 模型实例列表（含健康态与默认标记）

  - id: models_instance_create
    method: POST
    path: /models/instances
    summary: 创建模型实例
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 201
        content_type: application/json
        fields:
          id: {type: str}
          displayName: {type: str}
          modelName: {type: str}
          status: {type: str}
          isDefault: {type: bool}
          updatedAt: {type: str}
        error_codes: []
        notes: 来源 apps/admin-web/src/api/models.ts createModelInstance()。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
    notes: 新增模型配置

  - id: models_instance_delete
    method: DELETE
    path: /models/instances/{instance_id}
    summary: 删除模型实例
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          success: {type: bool}
        error_codes: []
        notes: 来源 apps/admin-web/src/api/models.ts deleteModelInstance()。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
    notes: 删除模型配置

  - id: models_discover
    method: POST
    path: /models/discover
    summary: 代理探测 provider 可用模型（031）
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          models: {type: array, item: object}
          models[].id: {type: str}
          models[].name: {type: str}
          models[].ownedBy: {type: str, required: false}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/models.ts discoverProviderModels() 解包
          data?.models；ModelsPage.vue「获取模型列表」下拉点选。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
    notes: 探测模型（OpenAI 兼容 /v1/models、Azure deployments）

  # ════════════════════════════════════════════════════════════════════════
  # Directory（组织架构 / 用户 CRUD）
  # ════════════════════════════════════════════════════════════════════════
  - id: directory_departments_tree
    method: GET
    path: /directory/departments/tree
    summary: 部门树
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          code: {type: str}
          status: {type: str}
          parentId: {type: str}
          userCount: {type: int}
          children: {type: array, item: object}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/directory.ts fetchDepartmentTree()
          （DepartmentNode 递归）；OrganizationUsersPage.vue 部门筛选、
          TrafficAllocationsPage.vue 团队下拉复用部门树。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
    notes: 部门树（含成员计数）

  - id: directory_users_list
    method: GET
    path: /directory/users
    summary: 用户列表（分页 + 过滤）
    query:
      departmentId: {type: str, required: false}
      keyword: {type: str, required: false}
      statusFilter: {type: str, required: false}
      sourceFilter: {type: str, required: false}
      page: {type: int, required: false}
      pageSize: {type: int, required: false}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          mobile: {type: str}
          email: {type: str}
          status: {type: str}
          source: {type: str}
          sourceUserId: {type: str}
          loginName: {type: str}
          primaryDepartmentId: {type: str}
          primaryDepartmentName: {type: str}
          customFields: {type: object, required: false}
          updatedAt: {type: str}
          positionRoles: {type: array, item: object}
          pendingPositionRole: {type: bool, required: false}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/directory.ts fetchUsers()
          （DirectoryUserItem）；OrganizationUsersPage.vue 表格渲染
          row.status / row.primaryDepartmentName / row.positionRoles，
          行筛选读取 statusFilter 命中。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
    notes: 用户列表（状态/来源过滤）

  - id: directory_user_create
    method: POST
    path: /directory/users
    summary: 创建用户
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 201
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          loginName: {type: str}
          status: {type: str}
        error_codes: []
        notes: >-
          来源 apps/admin-web/src/api/directory.ts createUser()；OrganizationUsersPage.vue
          新增用户表单提交。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
    notes: 新增用户

  - id: directory_user_update
    method: PUT
    path: /directory/users/{user_id}
    summary: 更新用户
    query: {}
    request_headers:
      Authorization: "Bearer <token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          id: {type: str}
          name: {type: str}
          status: {type: str}
