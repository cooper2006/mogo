gaps:
  - id: G1
    title: tools_test 响应体结构不稳定
    detail: >-
      apps/admin-web/src/api/tools.ts testTool() / testDraftTool() 返回
      Record<string, any>，消费方未对响应键做类型断言；ToolEditPage.vue 仅显示
      「测试通过/失败」，不同实现可能返回 success/message/result/data 等不同键。
      契约仅列出常见键，服务端若改键名不会被消费方察觉（FR-17 容忍，但属
      FR-18 潜在风险）。
  - id: G2
    title: 目录/账号删除与停用返回体未断言
    detail: >-
      apps/admin-web/src/api/directory.ts deleteUser()/disableUser()/enableUser() 与
      organizations.ts 部分删除接口无 TS 返回类型；OrganizationUsersPage.vue 与
      OrganizationAccountsPage.vue 仅关心是否抛错（axios 拦截器统一处理 401/403，
      行 395-402 分支 400/404/422/5xx/ECONNABORTED）。契约对这类接口只列
      id/success 二选一的宽松字段，服务端改返回体不影响消费方，但会削弱
      FR-18 的阻断能力。
  - id: G3
    title: 消费方分支依赖非 api.* 业务码
    detail: >-
      KnowledgeDocumentsPage.vue 行 1095 读 `error.response?.data?.detail?.code ===
      'DUPLICATE_FILENAME'`；SkillZipInstaller.vue 读
      `detail.code === 'skill_upgrade_confirmation_required'` 与
      `detail.upgrade`；skillInstallError.ts 读 `detail.code === 'metadata_mismatch'` /
      'missing_metadata'。这些码**不在** ApiErrorCode 注册表（FR-11/FR-29），
      契约 error_codes 只允许 api.* 码，故此处仅登记对应的 api.conflict /
      api.validation_error 等稳定码，业务码差异作为 gap 记录，待 US2/T011 状态码
      语义修复统一。
  - id: G4
    title: platform/tenants POST 与列表字段命名风格不一致
    detail: >-
      apps/admin-web/src/api/platform.ts createTenant() 返回 snake_case
      TenantCreateResult（tenant_id / org_name），而列表/详情使用 camelCase
      PlatformTenant（tenantId / name / adminUsername）。消费方已分别适配，
      但两种风格并存违反 FR-23（JSON + snake_case 两侧一致）的严格口径，
      建议服务端统一（当前为 gap，未改服务端）。
  - id: G5
    title: canary / trust-ratings 使用 {code, data} 信封，与其余 admin-api 端点不一致
    detail: >-
      apps/admin-web/src/api/skillCanary.ts 与 trustRatings.ts 均解包
      `data.data`（{code, message, data} 信封），而 skills / tools / models 等
      端点直接返回业务对象。同一服务两种响应形状并存，契约已按消费方实际读取
      分别记录，未做统一（改服务端需跨特性联调，超出本契约范围）。
  - id: G6
    title: 消费方未区分 429 限流
    detail: >-
      apps/admin-web/src/api/client.ts 拦截器仅分支 401/403（跳登录），
      OrganizationUsersPage.vue / OrganizationAccountsPage.vue 分支
      400/404/422/5xx/ECONNABORTED，全仓未见对 429 或 api.rate_limited 的
      消费分支。因此 admin-api 契约未登记 429 响应（FR-17 只覆盖消费方
      实际分支）；服务端 429 将落到通用错误提示，属待补项。