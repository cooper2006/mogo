    fields:
      code:
        type: int
      data:
        type: array
        item: object
      data[].id:
        type: str
      data[].user_id:
        type: str
      data[].title:
        type: str
      data[].created_at:
        type: str
      data[].updated_at:
        type: str
      data[].last_message_at:
        type: str
        required: false
      data[].last_message_preview:
        type: str
        required: false
      data[].message_count:
        type: int
