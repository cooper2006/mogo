gaps:
- FR-23 序列化一致：chat-api 大量端点返回 camelCase（skills `_admin_shape_skill`、auth `_create_session`、models `ChatModelOption` 等），与消费方 TS 类型一致但违反 FR-23 snake_case 预期。契约按消费方实际读取写 camelCase，未强制服务端改命名（本任务不改服务端代码）。
- error_codes 收敛：chat-api endpoints 里仍有 HTTPException(detail=...) 直抛（如 skill_package_install.py:55 的 'skill_upgrade_confirmation_required'、skill_lifecycle.py:26 的 EvalGateBlocked/reason、sessions.py 的 'Session
  not found'），未走 app/core/errors.py 的 ApiErrorCode 稳定码。契约在相应 interaction 的 notes/gaps 已标注，未把非 api.* 子码写进 error_codes。
- envelope 不一致：portal.py 的 catalog/requests 与 models.py 的 /models/available 走裸分页/裸数组或 {code,data}，未统一 ApiResponse；消费方按实际响应读取，契约按实际写。
- admin-web 不是 chat-api 直接消费方：apps/admin-web/src/api/skills.ts 的 `/api/skills/{id}/publish`、apps/admin-web/src/api/models.ts 的 `/api/models/instances/{id}/test/stream` 均走 admin-api 网关转发，消费方代码里的 `/api/...`
  前缀指向 admin-api，本契约不覆盖；admin-api 契约需自行收编。
- portal/requests 端点服务端定义 status_code=201（portal.py:162），消费方仅按 2xx 处理，未区分 201/200，契约统一写 200（消费方视角）。
- chat/completions 的响应 content_type 实为 application/x-ndjson（逐行 JSON 事件），而非 SSE text/event-stream；chat/messages/{id}/events 才是标准 SSE。契约如实标注。
- T036 无消费方端点登记：list_skill_updates / list_skill_share_inbox / fetch_personal_knowledge /
  list_site_profiles / list_scheduled_jobs 在 apps/user-web 源码中无直接调用 URL（管理端经
  admin-api BFF 或尚未接线），consumer_refs 工具以 NO_CONSUMER_ALLOWLIST 白名单豁免 path 证据
  （不阻断）；删除前需确认已接线或已从契约移除。
  - T038 FR-23 snake_case 覆盖率偏低：契约字段以 camelCase 为主（见本文件 gaps 既有条目），
    明细登记在 contracts/_camel_case_known.yaml（serialization_check.py --seed 生成，三份契约
    共 103 个 interaction 含 camelCase 字段）；服务端迁移到 snake_case 后逐项从白名单移除。