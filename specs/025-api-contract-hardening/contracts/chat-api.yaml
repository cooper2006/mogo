    email:
      type: str
      required: true
    password:
      type: str
      required: true
    nickname:
      type: str
      required: false
    departmentId:
      type: str
      required: false
  responses:
  - status: 200
    content_type: application/json
    fields:
      code:
        type: int
      message:
        type: str
      data.token:
        type: str
      data.profile:
        type: object
    error_codes: []
    notes: apps/user-web/src/api/auth.ts register → tokenResult（读 data.token / data.profile；失败读 payload.message）。
  - status: 409
    error_codes:
    - api.conflict
    content_type: application/json
  - status: 422
    error_codes:
    - api.validation_error
    content_type: application/json
  notes: ''
- id: auth_switch_tenant
  method: POST
  path: /auth/switch-tenant
  summary: 切换到另一可用组织
  request_body:
    tenantId:
