    content_type: application/json
  notes: ''
- id: auth_portal_exchange
  method: POST
  path: /auth/portal-exchange
  summary: 门户 SSO 一次性票据换会话（029）
  request_body:
    portal_token:
      type: str
      required: true
  responses:
  - status: 200
    content_type: application/json
    fields:
      code:
        type: int
      data.token:
        type: str
        required: false
      data.profile:
        type: object
        required: false
