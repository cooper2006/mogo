name: chat-api
version: 1.0.0
provider: chat-api
consumers:
- user-web
base_path: /api/v1  # 025 T045（FR-27）：主版本路径；旧 /api 由 LegacyApiRedirectMiddleware 301/308 重定向
notes: "chat-api 契约（T031 / FR-16 / FR-17）。\n- 消费方：apps/user-web（Vue 3 + TS）。经 grep 与逐文件核对，\n  apps/admin-web 的全部 `/api/...` 调用走其自身 apiClient\n  （`apps/admin-web/src/api/client.ts:5` baseURL `/admin-api`，指向\
  \ admin-api 服务），\n  `apps/admin-web/src/api/skills.ts:187` 的 `/api/skills/{id}/publish` 亦由\n  admin-api 代理转发，因此 **admin-web 不是 chat-api 的直接消费方**，未列入 consumers。\n- 消费方实际 baseURL 为 `/askai-api/api`（`apps/user-web/src/api/*.ts`\
  \ 多处\n  `createApiClient({ baseURL: '/askai-api/api' })`），经反向代理映射到 chat-api 的 `/api`\n  前缀；契约中所有 `path` 均不含 `/api`。\n- 字段命名：FR-23 期望 snake_case，但 chat-api 现有 `_admin_shape_skill` /\n  `_create_session`\
  \ 等返回 camelCase（`createdAt`、`tenantId`、`userId` 等），\n  且消费方 TS 类型按 camelCase 读取；契约按**实际消费**写 camelCase，差异记入 `gaps`。\n- 错误体：`app/core/errors.py` 的 `ErrorResponse` 同时携带 `detail`（字符串）\n  与 `message`；消费方\
  \ auth / skills / tools / personal-knowledge 等模块\n  `errorMessageOf`/`failureMessage` 只读 `response.data.message` / `payload.message`，\n  因此非 2xx 响应列出 `message` 字段。稳定码一律使用注册表的 `api.*` 码。\n"
interactions:
- id: auth_login
  method: POST
  path: /auth/login
  summary: 用户名密码登录（多租户时返回选租户挑战）
  request_body:
    username:
      type: str
      required: true
    password:
      type: str
      required: true
    tenantId:
      type: str
      required: false
  request_headers:
    Content-Type: application/json
  responses:
  - status: 200
    content_type: application/json
    fields:
      code:
        type: int
      message:
        type: str
      data:
        type: object
      data.requiresTenantSelection:
        type: bool
        required: false
      data.challengeToken:
        type: str
        required: false
      data.candidates:
        type: array
        item: object
        required: false
      data.candidates[].tenantId:
        type: str
      data.candidates[].orgName:
        type: str
      data.candidates[].userId:
        type: str
      data.candidates[].displayName:
        type: str
      data.candidates[].username:
        type: str
      data.token:
        type: str
        required: false
      data.profile:
        type: object
        required: false
      data.profile.userId:
        type: str
      data.profile.name:
        type: str
      data.profile.tenantId:
        type: str
      data.profile.orgName:
        type: str
      data.profile.spaceType:
        type: str
      data.profile.canAccessAdmin:
        type: bool
      data.profile.edition:
        type: str
      data.profile.billingEnabled:
        type: bool
      data.profile.memberLimit:
        type: int
        required: false
      data.profile.availableTenants:
        type: array
        item: object
        required: false
      data.profile.agentPolicy:
        type: object
        required: false
    error_codes: []
    notes: 消费方 apps/user-web/src/api/auth.ts loginWithPassword → tokenResult / tenantSelectionResult / normalizeProfile（读 token、profile、requiresTenantSelection、challengeToken、candidates）；isOk 判断 code===0
      || success===true。
  - status: 401
    error_codes:
    - api.unauthorized
    content_type: application/json
  - status: 422
    error_codes:
    - api.validation_error
    content_type: application/json
  notes: 多租户登录走 /auth/login/select-tenant（auth_login_select_tenant）；单租户直接返回 token+profile。
- id: auth_login_select_tenant
  method: POST
  path: /auth/login/select-tenant
  summary: 用挑战令牌完成选租户登录
  request_body:
    challengeToken:
      type: str
      required: true
    tenantId:
      type: str
      required: true
  responses:
  - status: 200
    content_type: application/json
    fields:
      code:
        type: int
      message:
        type: str
      data.token:
        type: str
      data.profile:
        type: object
      data.profile.userId:
        type: str
      data.profile.name:
        type: str
      data.profile.tenantId:
        type: str
      data.profile.spaceType:
        type: str
      data.profile.canAccessAdmin:
        type: bool
      data.profile.edition:
        type: str
      data.profile.billingEnabled:
        type: bool
      data.profile.availableTenants:
        type: array
        item: object
        required: false
    error_codes: []
    notes: apps/user-web/src/api/auth.ts selectTenantAndLogin（失败读 payload.message，成功取 data.token / data.profile）。
  - status: 401
    error_codes:
    - api.unauthorized
    content_type: application/json
  - status: 422
    error_codes:
    - api.validation_error
    content_type: application/json
  notes: 登录挑战 5 分钟有效（chat-api endpoints/auth.py _create_login_challenge）。
- id: auth_me
  method: GET
  path: /auth/me
  summary: 读取当前登录用户资料
  request_headers:
    Authorization: Bearer <token>
  responses:
  - status: 200
    content_type: application/json
    fields:
      code:
        type: int
      message:
        type: str
      data:
        type: object
      data.userId:
        type: str
      data.name:
        type: str
      data.username:
        type: str
      data.phone:
        type: str
      data.email:
        type: str
      data.avatar:
        type: str
      data.tenantId:
        type: str
      data.orgName:
        type: str
      data.spaceType:
        type: str
      data.canAccessAdmin:
        type: bool
      data.edition:
        type: str
      data.billingEnabled:
        type: bool
      data.memberLimit:
        type: int
        required: false
      data.availableTenants:
        type: array
        item: object
        required: false
      data.agentPolicy:
        type: object
        required: false
    error_codes: []
    notes: apps/user-web/src/api/auth.ts fetchUserProfile → normalizeProfile 逐字段兜底；GET 只读（022 FR-15/T032），租户快照走 auth_me_refresh_tenants。
  - status: 401
    error_codes:
    - api.unauthorized
    content_type: application/json
  notes: chat-api endpoints/auth.py me()；profile 用 _profile_with_policy 组装。
- id: auth_me_refresh_tenants
  method: POST
  path: /auth/me/refresh-tenants
  summary: 显式刷新当前会话的租户快照（GET 只读拆分）
  request_headers:
    Authorization: Bearer <token>
  responses:
  - status: 200
    content_type: application/json
    fields:
      code:
        type: int
      data.availableTenants:
        type: array
        item: object
        required: false
    error_codes: []
    notes: apps/user-web/src/api/auth.ts refreshTenantSnapshot（在 fetchUserProfile 之后 fire-and-forget 调用，读取 response.data.data 作为租户快照）。
  - status: 401
    error_codes:
    - api.unauthorized
    content_type: application/json
  notes: 022 FR-15（T032）从 GET /auth/me 拆出的写端点。
- id: auth_logout
  method: POST
  path: /auth/logout
  summary: 注销当前会话
  request_headers:
    Authorization: Bearer <token>
  responses:
  - status: 200
    content_type: application/json
    fields:
      code:
        type: int
      data.success:
        type: bool
    error_codes: []
    notes: apps/user-web/src/api/auth.ts logoutWithToken（catch 忽略错误，只认 2xx）。
  - status: 401
    error_codes:
    - api.unauthorized
    content_type: application/json
  notes: 注销置 token_id 会话 status=revoked。
