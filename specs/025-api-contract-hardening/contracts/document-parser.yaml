name: document-parser
version: "1.0.0"
provider: document-parser
consumers:
  - admin-api            # 内部 HTTP 调用（urllib）：提交解析/预览/索引任务、删除向量
  - chat-api             # 内部 HTTP 调用（httpx）：同步 parse-markdown、retrieval/search
  - deployment           # docker-compose / admin-api setup 健康探针（仅检查 HTTP 状态码）
  - admin-web            # 间接消费：经 admin-api BFF /api/knowledge/documents/* 触发（无直连 URL）
  - user-web             # 间接消费：经 chat-api BFF /askai-api/api/documents/* 触发（无直连 URL）
base_path: /api
interactions:
  - id: create_document_parse_job
    method: POST
    path: /jobs/document-parse
    summary: 创建文档解析任务（异步，Celery）
    request_body:
      documentId: {type: str, required: true}
      tenantId: {type: str, required: false}
      source:
        storageType: {type: str, required: true}
        storageBucket: {type: str, required: false}
        storageKey: {type: str, required: true}
        filename: {type: str, required: false}
        mimeType: {type: str, required: false}
      artifacts:
        storageType: {type: str, required: false}
        storageBucket: {type: str, required: false}
        storagePrefix: {type: str, required: true}
      callback:
        url: {type: str, required: true}
        token: {type: str, required: true}
      minChunkSize: {type: int, required: false}
      chunkSize: {type: int, required: false}
      chunkOverlap: {type: int, required: false}
    request_headers:
      Authorization: "Bearer <document_processing_service_token>"
    responses:
      - status: 202
        content_type: application/json
        fields:
          jobId: {type: str}
          status: {type: str}
        error_codes: []
        notes: admin-api 仅读取 jobId（不读 status）；见 services/admin-api/app/api/routes/knowledge_documents.py:_request_document_parse
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
      - status: 503
        error_codes: [api.service_unavailable]
    notes: |
      异步任务端点，长耗时解析走 Celery。请求体字段由
      services/admin-api/app/api/routes/knowledge_documents.py:_request_document_parse 发送，
      chunk 参数来自 admin-api settings.knowledge_min_chunk_size / knowledge_chunk_size / knowledge_chunk_overlap。
      503 由路由在 Celery apply_async 抛错时返回（detail="任务队列不可用"），
      消费方将 urllib HTTPError/URLError 统一映射为 RuntimeError("document processing service unavailable")，
      因此 401/403/422/503 在消费方侧都走同一 catch 分支（不区分处理）。
  - id: parse_document_markdown
    method: POST
    path: /documents/parse-markdown
    summary: 同步解析为 Markdown（chat-api PDF 远程解析主路径）
    request_body:
      source:
        storageType: {type: str, required: true}
        storageBucket: {type: str, required: false}
        storageKey: {type: str, required: true}
        filename: {type: str, required: false}
        mimeType: {type: str, required: false}
      sourceUrl: {type: str, required: false}
      minChunkSize: {type: int, required: false}
      chunkSize: {type: int, required: false}
      chunkOverlap: {type: int, required: false}
    request_headers:
      Authorization: "Bearer <DOCUMENT_PROCESSING_SERVICE_TOKEN>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          markdown: {type: str}
          raw: {type: object}
          rawChunks: {type: array, item: object}
          ragChunks: {type: array, item: object}
          parser: {type: str}
          markdownChars: {type: int}
        error_codes: []
        notes: chat-api 逐个读取上述字段；raw 作为 structured_content、markdownChars/rawChunks/ragChunks 进 parse_quality；见 services/chat-api/app/services/document_processing_parse_client.py:parse_markdown
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 404
        error_codes: [api.not_found]
      - status: 422
        error_codes: [api.validation_error]
    notes: |
      chat-api 的主路径（PDF 优先走远程，失败再本地回退）。
      请求体由 services/chat-api/app/services/document_processing_parse_client.py:parse_markdown
      （_source_from_document / _source_url_from_document）组装，仅 storage_type=="local" 时带 sourceUrl。
      404 对应路由 FileNotFoundError → "source document not found"，422 对应路由兜底 Exception → str(exc)；
      chat-api 对 status>=400 统一走 "document_processing_http_{status}" 分支，不区分 404/422。
  - id: create_preview_convert_job
    method: POST
    path: /jobs/preview-convert
    summary: 创建 Office 文档预览转换任务（异步，输出 PDF）
    request_body:
      documentId: {type: str, required: true}
      tenantId: {type: str, required: false}
      source:
        storageType: {type: str, required: true}
        storageBucket: {type: str, required: false}
        storageKey: {type: str, required: true}
        filename: {type: str, required: false}
        mimeType: {type: str, required: false}
      target:
        storageType: {type: str, required: false}
        storageBucket: {type: str, required: false}
        storageKey: {type: str, required: true}
        filename: {type: str, required: false}
        mimeType: {type: str, required: false}
      callback:
        url: {type: str, required: true}
        token: {type: str, required: true}
    request_headers:
      Authorization: "Bearer <document_processing_service_token>"
    responses:
      - status: 202
        content_type: application/json
        fields:
          jobId: {type: str}
          status: {type: str}
        error_codes: []
        notes: admin-api 仅读取 jobId（不读 status）；见 services/admin-api/app/api/routes/knowledge_documents.py:_request_preview_conversion
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
      - status: 503
        error_codes: [api.service_unavailable]
    notes: |
      预览转换是 003 特性「Office → PDF」的唯一异步入口，仅对 doc/docx/xls/xlsx/ppt/pptx 触发
      （services/admin-api/app/api/routes/knowledge_documents.py:_needs_preview_conversion）。
      target.storageKey 由消费方拼为 "<source_key>.preview.pdf"，回调走
      admin-api 的 /api/knowledge/documents/{id}/preview-callback。
  - id: create_document_index_job
    method: POST
    path: /jobs/document-index
    summary: 创建向量索引任务（异步，写入 Weaviate）
    request_body:
      documentId: {type: str, required: true}
      tenantId: {type: str, required: false}
      knowledgeBaseId: {type: str, required: false}
      chunkStage: {type: str, required: false}
      config: {type: object, required: false}
      callback:
        url: {type: str, required: true}
        token: {type: str, required: true}
    request_headers:
      Authorization: "Bearer <document_processing_service_token>"
    responses:
      - status: 202
        content_type: application/json
        fields:
          jobId: {type: str}
          status: {type: str}
        error_codes: []
        notes: admin-api 仅读取 jobId（不读 status）；见 services/admin-api/app/api/routes/knowledge_documents.py:_request_document_index
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
      - status: 503
        error_codes: [api.service_unavailable]
    notes: |
      消费方固定发送 chunkStage="rag"，config 来自租户知识库设置快照
      （services/admin-api/app/api/routes/knowledge_documents.py:_knowledge_settings_snapshot），
      回调走 admin-api 的 /api/knowledge/documents/{id}/index-callback。
  - id: search_retrieval
    method: POST
    path: /retrieval/search
    summary: 向量/混合检索（chat-api 内部知识 QA）
    request_body:
      query: {type: str, required: true}
      tenantId: {type: str, required: false}
      userId: {type: str, required: false}
      knowledgeBaseId: {type: str, required: false}
      topN: {type: int, required: false}
      candidateTopK: {type: int, required: false}
      retrievalMode: {type: str, required: false}
      filters: {type: object, required: false}
      rerank: {type: bool, required: false}
    request_headers:
      Authorization: "Bearer <document_processing_service_token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          query: {type: str}
          retrievalMode: {type: str}
          topN: {type: int}
          items: {type: array, item: object}
          items[].documentId: {type: str}
          items[].chunkId: {type: str}
          items[].chunkStage: {type: str}
          items[].text: {type: str}
          items[].contextualText: {type: str}
          items[].titlePath: {type: array, item: str}
          items[].pageNo: {type: int}
          items[].contentType: {type: str}
          items[].sourceChunkIds: {type: array, item: str}
          items[].ordinal: {type: int}
          items[].score: {type: float}
          items[].distance: {type: float}
          items[].rerankScore: {type: float}
          total: {type: int}
        error_codes: []
        notes: |
          chat-api 经 pydantic RetrievalSearchResult/RetrievalChunkItem 校验后逐个读取上述字段，
          排序键为 item.rerankScore ?? item.score；见 services/chat-api/app/knowledge/retrieval/retrieval_client.py:search
          与 services/chat-api/app/knowledge/retrieval/schemas.py:RetrievalChunkItem，
          最终消费方为 services/chat-api/app/knowledge/agents/knowledge_qa_agent.py:KnowledgeQAAgent.retrieve_chunks。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
      - status: 503
        error_codes: [api.service_unavailable]
    notes: |
      路由对 EmbeddingProviderError / VectorStoreError 均返回 503（detail=str(exc)）。
      chat-api 对任意非 2xx 走 resp.raise_for_status() → 抛 KnowledgeRetrievalError
      （"内部知识检索失败"），不区分 503 与 401/403。
      items[].distance 与 items[].rerankScore 可为 null（chat-api schema 中 Optional[float]），
      metadata 字段 chat-api 用默认 {} 容忍缺失（未在本契约列出，消费方不强制读取）。
  - id: batch_document_parse
    method: POST
    path: /documents/parsing/batch
    summary: >-
      批量解析（003 里程碑接口，FR-14 覆盖对象）。当前提供方未实现、无消费方调用，
      本条目按 025 spec.md:206 声明的接口形状立约，仅作契约锚点，见下方 gaps.batch-parse-endpoint-missing。
    request_body:
      documents:
        type: array
        item: object
      documents[].documentId:
        type: str
      documents[].source:
        type: object
        required: false
    request_headers:
      Authorization: "Bearer <document_processing_service_token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          status:
            type: str
          results:
            type: array
            item: object
          results[].documentId:
            type: str
          results[].ok:
            type: bool
          results[].jobId:
            type: str
            required: false
          results[].error:
            type: object
            required: false
          partial:
            type: bool
            required: false
        error_codes: []
        notes: >-
          FR-14 批量语义（逐项结果数组 + 整体 status + partial 标记）的覆盖锚点。
          ⚠️ 本端点当前零实现、零消费方：services/document-parser/app/api/routes/ 五个业务路由
          全量通读无 batch 端点；apps/admin-web/src 的批量上传/批量删除
          （views/knowledge/KnowledgeDocumentsPage.vue:211 / :1244）走的是 admin-api
          validate_batch_size（services/admin-api/app/api/routes/knowledge_documents.py:55-100），
          并非 document-parser 契约。字段按 025 spec.md:73 的 FR-14 规则推定，非消费方实际读取。
      - status: 422
        error_codes: [api.validation_error]
        notes: FR-14 规定超限（>N=100）返回 422，字段级 detail 由 admin-api validate_batch_size
          定义（code/message/field/path/limit/count）。
    notes: >-
      003 spec.md / plan.md / checklists 均无 batch 定义，与 025 spec.md:206 的声明冲突。
      本条目立约以暴露差异（FR-14 语义未收敛到 document-parser），
      不作为消费方可调用的端点；待 003 侧补定义与实现后再回填字段与状态码。
  - id: delete_document_vectors
    method: POST
    path: /vectors/documents/deletion
    summary: 删除文档向量（025 T010 资源化改名后的新路径）
    request_body:
      documentId: {type: str, required: true}
      tenantId: {type: str, required: false}
      config: {type: object, required: false}
    request_headers:
      Authorization: "Bearer <document_processing_service_token>"
    responses:
      - status: 200
        content_type: application/json
        fields:
          documentId: {type: str}
          deleted: {type: int}
          vectorStoreType: {type: str}
          collectionName: {type: str}
        error_codes: []
        notes: |
          admin-api 删除文档时读取 deleted / vectorStoreType / collectionName 并回写
          vector_deleted_count / vector_store_type / vector_collection_name；见
          services/admin-api/app/api/routes/knowledge_documents.py:_request_document_vector_delete 的调用处
          （删除接口内 vector_result.get("deleted"|"vectorStoreType"|"collectionName")）。
          ⚠️ 当前消费方实际 POST 的是旧别名路径（见 delete_document_vectors_legacy），尚未迁移到本路径。
      - status: 401
        error_codes: [api.unauthorized]
      - status: 403
        error_codes: [api.forbidden]
      - status: 422
        error_codes: [api.validation_error]
    notes: |
      025 T010 已将动词化旧路径改为资源化新路径。本交互按消费方实际读取的响应形状立约，
      但无消费方当前命中本路径，迁移状态见下方 gaps。
  - id: delete_document_vectors_legacy
    method: POST
    path: /vectors/documents/delete
    summary: 旧路径别名（已被 025 T010 改为 308 永久重定向）
    deprecated: true
    deprecated_since: "1.0.0"
    request_body:
      documentId: {type: str, required: false}
      tenantId: {type: str, required: false}
    request_headers:
      Authorization: "Bearer <document_processing_service_token>"
    responses:
      - status: 308
        content_type: text/plain
        fields: []
        error_codes: []
        notes: 仅测试断言使用 location 头指向 /vectors/documents/deletion；见 services/document-parser/tests/test_compat_alias_redirect_010.py
    notes: |
      兼容别名，保留 POST 方法（308 而非 301，避免客户端改为 GET）。
      实际仍调用本旧路径的两个消费方：
      services/admin-api/app/api/routes/knowledge_documents.py:_request_document_vector_delete（line 635）
      与 services/admin-api/app/services/tenant_purge.py（line 513）。
      二者均使用 urllib.request；Python 3.11+ 的 HTTPRedirectHandler 已支持 308
      （http_error_308 → 保留 POST 重发），故调用实际可达并落到 /vectors/documents/deletion，
      迁移必要性见下方 gaps.vector-delete-consumer-still-on-deprecated-alias。
  - id: service_health
    method: GET
    path: /health
    summary: 存活检查（docker-compose 健康探针）
    status_only: true
    responses:
      - status: 200
        content_type: application/json
        fields:
          status:
            type: str
            required: false
          service:
            type: str
            required: false
        error_codes: []
        notes: >-
          docker-compose 探针仅调用 urlopen().read()，只依赖 HTTP 状态码，不读取 body 字段；
          服务端 /health 返回 {"status":"ok", "service":"mogo-document-processing-service", ...}
          （services/document-parser/app/api/routes/health.py），消费方零读取故字段均 required=false；
          为满足 US3 验收"每个 200 响应 fields 非空"，按实际返回形状登记 status/service。
    notes: |
      消费方为部署编排层：deploy/docker-compose.yml:763 document-api healthcheck
      （urlopen('http://127.0.0.1:8200/api/health', timeout=3)）。status_only=true，
      消费方不读任何响应体字段。
  - id: service_ready
    method: GET
    path: /ready
    summary: 就绪检查（admin-api setup 部署状态页）
    status_only: true
    responses:
      - status: 200
        content_type: application/json
        fields:
          status:
            type: str
            required: false
          service:
            type: str
            required: false
          checks:
            type: object
            required: false
        error_codes: []
        notes: 消费方仅断言 response.status < 400；见 services/admin-api/app/api/routes/setup.py:_probe_http。
          服务端 /ready 返回 {"status":"ok"|"degraded", "service", "checks":{panweidb/redis/weaviate/worker/docling：bool}}
          （services/document-parser/app/api/routes/health.py），消费方零读取故字段标 `required：false`。
      - status: 503
        error_codes: [api.service_unavailable]
    notes: |
      任一后端依赖（panweidb/mongo、redis、weaviate、worker、docling）不可用时返回 503。
      消费方：services/admin-api/app/api/routes/setup.py:_deployment_services（document_ready 探测
      "document-processing" → admin-web 的 SetupDeploymentStatus.vue 显示"文档处理与 Worker"）。
      status_only=true：消费方仅依据 HTTP 状态码判断 ok/not ok，不读取 checks 字段。
gaps:
  - id: batch-parse-endpoint-missing
    severity: high
    description: >-
      003 特性遗留的批量解析接口在本仓库中不存在，FR-14 批量语义（逐项结果数组 + 整体 status +
      partial 标记）在 document-parser 无任何落地，亦无消费方调用。
    evidence: >-
      services/document-parser/app/api/routes/ 五个业务路由（document_parsing.py / document_indexing.py /
      preview_conversion.py / retrieval.py / vector_maintenance.py）全量通读，无任何 batch 端点；
      services/document-parser/app/domain/jobs.py 只有 ParseDocumentJobRequest/ParseMarkdownRequest/
      PreviewConvertJobRequest/IndexDocumentJobRequest 等单文档模型，无批量模型。
      全仓 services/ 目录 grep "batchParse|batch_parse|parsing/batch|batch-convert" 零命中。
      specs/003-document-ingestion-delivery/spec.md、checklists、plan.md、quickstart.md 均无 batch 定义。
    conflict: >-
      025 spec.md:206 声明"003 的批量解析接口（POST /documents/parsing/batch）是 FR-14 批量语义的覆盖对象"，
      与 003 全部文档无 batch 定义、document-parser 无对应路由的事实矛盾——跨 spec 的声明与实现不一致。
    action: >-
      如需覆盖 FR-14，需在 document-parser 新增 POST /api/documents/parsing/batch（含 size 上限 100、
      超限 422、全成功 200 / 全失败 4xx-5xx / 部分失败 200+partial=true），并在 003 spec.md 补 batch 接口定义。
      在本契约（T032）阶段未新增，仅记录现状。
  - id: vector-delete-consumer-still-on-deprecated-alias
    severity: high
    description: >-
      admin-api 的向量删除调用仍指向 025 T010 已标为 deprecated 的旧别名 /vectors/documents/delete，
      未迁移到新路径 /vectors/documents/deletion；新路径目前无消费方直接命中。
    evidence: >-
      services/admin-api/app/api/routes/knowledge_documents.py:635（_request_document_vector_delete，
      f"{base_url}/api/vectors/documents/delete"）；services/admin-api/app/services/tenant_purge.py:513
      （f"{base_url}/vectors/documents/delete"）。
    note: >-
      兼容别名现返回 308 永久重定向；Python 3.11+ 的 urllib HTTPRedirectHandler 已支持 308
      （http_error_308 保留 POST 重发），故调用实际仍可达新路径，但消费方依赖隐式重定向，
      与 025 FR-22 弃用策略/契约立约路径不一致。
    action: >-
      把 _request_document_vector_delete 与 tenant_purge 的路径改为 /api/vectors/documents/deletion，
      使消费方显式命中契约路径；旧别名保留观察期（FR-22，默认 2 minor）后移除。
      契约已按新路径立约（delete_document_vectors），并把旧路径标 deprecated，
      供 T010 迁移与 deprecation_check.py（FR-22）扫描。
  - id: tenant-purge-missing-api-prefix
    severity: medium
    description: >-
      tenant_purge.py 的向量删除 URL 缺少 /api 前缀，与文档其余调用方不一致，实际 404。
    evidence: >-
      services/admin-api/app/services/tenant_purge.py:513 使用 f"{base_url}/vectors/documents/delete"；
      admin-api settings.document_processing_base_url 默认 "http://127.0.0.1:8200"（app/core/config.py:85，
      不含 /api），故实际请求打到 /vectors/documents/delete（无 /api），404。
      对比 knowledge_documents.py 全部调用都带 /api 前缀（:495/:558/:602/:635）。
    action: 改为 f"{base_url}/api/vectors/documents/delete"（并随上一条一起迁到 /deletion）。
  - id: get-job-status-has-no-consumer
    severity: medium
    description: >-
      提供方提供 GET /jobs/{job_id}（preview_conversion.py:39，返回 job dict），但消费方无人调用，
      索引/解析/预览状态改由提供方回调 admin-api（parse-callback / index-callback / preview-callback）回传，
      故未纳入本契约（FR-17）。
    evidence: >-
      services/document-parser/app/api/routes/preview_conversion.py:39 get_processing_job；
      admin-api 仅存 job_id（parse_job_id/index_job_id/preview_job_id）并依赖回调更新本地状态，
