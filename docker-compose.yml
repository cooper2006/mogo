name: mogo

x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 30s

# The DSH Runtime Host owns kernel session state in process memory, so one
# kernel_session_id must always reach the same instance.
#
# Two mutually exclusive topologies share this template, switched by compose
# profiles (single host is the default; pool is opt-in):
#
#   * single host (default) — one bare host, for minimal self-hosted
#     deployments. Started by plain `docker compose up -d` (no profile).
#     chat-api talks to it directly.
#   * pool — ``dsh-runtime-host-{1,2,3}`` behind the sticky LB.
#     Enable with `docker compose --profile pool up -d`; this also loads
#     `docker-compose.pool.yml` (auto-included when the `pool` profile is
#     active), which repoints chat-api at the LB and sets up replica URLs.
#
# `x-dsh-runtime-host-template` holds the settings both topologies inherit.
# The pool replicas and the LB carry their own `profiles: [pool]` entry:
# putting `profiles` inside the anchor would be merged into every service
# that inherits it (a YAML merge key copies the whole mapping), so the
# single-host service must stay profile-free to remain the default.
x-dsh-runtime-host-template: &dsh-runtime-host-template
  image: ${MOGO_DSH_RUNTIME_HOST_IMAGE:-${MOVO_DSH_RUNTIME_HOST_IMAGE:-ghcr.io/himovo/dsh-runtime-host:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
  pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
  restart: unless-stopped
  # R1: on SIGTERM the host first drains (waits up to 30s for in-flight
  # turns to finish) before disposing runtimes. The grace period must cover
  # that drain window or docker kills the process and the drain is cut off.
  stop_grace_period: 45s
  # 022 US3 (T027): container hardening, same shape as the other app services.
  # The image declares `USER node`, so `cap_drop: ALL` costs nothing: there is
  # no privilege drop at start-up and therefore no CAP_SETUID/CAP_SETGID needed.
  # Everything the host writes at runtime already lives outside the image:
  #   * kernel sessions / workspaces -> the dsh-runtime-data volume
  #   * $HOME/.dsh (anonymous user id) -> HOME is pinned into that same volume
  #   * the cordis host profile -> tmpfs (regenerated on every boot)
  #   * scratch -> tmpfs /tmp
  # so `read_only` is safe. tmpfs entries must state mode explicitly: Docker's
  # default is 0755, which the non-root user cannot write to.
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    # The cordis host profile is rewritten from config on every boot, so it
    # needs writable space but no persistence.
    - /app/host-profile-home:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0755
  environment:
    DSH_INSTANCE_ID: dsh-runtime-host
    # 官方 dsh web 模式开关（可选，默认关闭）：
    #   DSH_WEB_MODE=1           额外启动 `dsh --profile web`，把官方 Web GUI 暴露出来
    #   DSH_WEB_HOST=127.0.0.1   web 绑定地址（默认 127.0.0.1；dsh 有意拒绝
    #                            0.0.0.0，属官方安全设计，不要改）
    #   DSH_WEB_PORT=3080        web 端口（默认 3080，与 headless host 的 8101 互不影响）
    #   DSH_WEB_TRUSTED_HOST=    额外信任的 Host 值（逗号分隔），仅在部署到
    #                            非 localhost/127.0.0.1 的主机名/公网域名后需要；
    #                            localhost/127.0.0.1 访问永远被 dsh 的 browser-
    #                            trust fence 识别为 loopback，无需配置。
    # 不设置 DSH_WEB_MODE 时行为与旧镜像完全一致，仅运行 headless host。
    #
    # Web GUI 的对外暴露路径：mogo-gateway nginx 的 /dsh-web/ location
    # （见 deploy/nginx/nginx.conf），浏览器访问 http(s)://<gateway>/dsh-web/。
    # 不直接映射 3080 到宿主机——那种映射转发到的是容器网桥 IP 而非容器内
    # loopback，对 127.0.0.1 绑定无效（已实测确认）。
    DSH_WEB_MODE: ${DSH_WEB_MODE:-0}
  volumes:
    - deployment-secrets:/run/askai-secrets:ro
    - dsh-runtime-data:/data/dsh-runtime
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  networks:
    - backend
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        set -a; . /run/askai-secrets/runtime.env; set +a;
        node -e "fetch('http://127.0.0.1:8101/health',{headers:{authorization:'Bearer '+process.env.DSH_RUNTIME_HOST_TOKEN}}).then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(v=>{if(v.ok!==true||v.kernel!=='dsh')process.exit(1)}).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 20s

services:
  bootstrap:
    image: alpine:3.21
    restart: "no"
    # 022 US3 (T027): the bootstrap container only generates secrets into a
    # named volume, so it needs no privileges at all.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      MOGO_PORT: ${MOGO_PORT:-${MOVO_PORT:-${ASKAI_PORT:-3000}}}
    volumes:
      - deployment-secrets:/run/askai-secrets
    command:
      - /bin/sh
      - -ec
      - |
        # 022 US3 (T027): runtime.env 必须 0644。应用容器内的进程以非 root
        # 用户 appuser (UID 10001) 运行（见各 Dockerfile），0600 会让它们
        # 读不到自己的密钥。卷本身只在 docker 网络内以 :ro 挂载，不会暴露到宿主机。
        umask 022
        secret_file=/run/askai-secrets/runtime.env
        random_hex() { head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        if [ ! -s "$$secret_file" ]; then
          admin_secret="$$(random_hex)"
          admin_backend_service_token="$$(random_hex)"
          document_service_token="$$(random_hex)"
          document_callback_token="$$(random_hex)"
          temp_file="$${secret_file}.tmp"
          {
            echo "END_USER_AUTH_SECRET=$$(random_hex)"
            echo "ASKAI_ADMIN_JWT_SECRET=$$admin_secret"
            echo "ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
            echo "ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
            echo "MODEL_CONFIG_SECRET=$$admin_secret"
            echo "DSH_MODEL_GATEWAY_SIGNING_SECRET=$$(random_hex)"
            echo "DSH_RUNTIME_HOST_TOKEN=$$(random_hex)"
            echo "DOCUMENT_PROCESSING_SERVICE_TOKEN=$$document_service_token"
            echo "ASKAI_ADMIN_DOCUMENT_PROCESSING_SERVICE_TOKEN=$$document_service_token"
            echo "MOVO_DOC_PROCESSING_SERVICE_TOKEN=$$document_service_token"
            echo "ASKAI_ADMIN_DOCUMENT_PROCESSING_CALLBACK_TOKEN=$$document_callback_token"
            echo "MOVO_DOC_PROCESSING_CALLBACK_TOKEN=$$document_callback_token"
            echo "MOVO_DOC_PROCESSING_ADMIN_JWT_SECRET=$$admin_secret"
          } > "$$temp_file"
          mv "$$temp_file" "$$secret_file"
        fi
        if ! grep -q '^DSH_RUNTIME_HOST_TOKEN=' "$$secret_file"; then
          temp_file="$${secret_file}.tmp"
          cp "$$secret_file" "$$temp_file"
          echo "DSH_RUNTIME_HOST_TOKEN=$$(random_hex)" >> "$$temp_file"
          mv "$$temp_file" "$$secret_file"
        fi
        admin_backend_service_token="$$(sed -n 's/^ADMIN_BACKEND_SERVICE_TOKEN=//p' "$$secret_file" | head -n 1)"
        if [ -z "$$admin_backend_service_token" ]; then
          admin_backend_service_token="$$(sed -n 's/^ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=//p' "$$secret_file" | head -n 1)"
        fi
        if [ -z "$$admin_backend_service_token" ]; then
          admin_backend_service_token="$$(random_hex)"
        fi
        temp_file="$${secret_file}.tmp"
        sed '/^ADMIN_BACKEND_SERVICE_TOKEN=/d; /^ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=/d' "$$secret_file" > "$$temp_file"
        {
          echo "ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
          echo "ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
        } >> "$$temp_file"
        mv "$$temp_file" "$$secret_file"
        echo "MOVO deployment secrets are ready."
        echo "After services become healthy, open http://localhost:$${MOGO_PORT:-${MOVO_PORT:-3000}}/admin/setup"

  mongo:
    image: mongo:6.0.20
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  weaviate:
    image: semitechnologies/weaviate:1.25.7
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 单节点拓扑（默认）：一个裸 host，最小化自托管部署用。
  #
  # 无 profile，普通 `docker compose up -d` / `./mogo up` 即启动。
  # chat-api 默认直连它（DSH_RUNTIME_HOST_URL -> dsh-runtime-host:8101）。
  #
  # 池化拓扑（opt-in，`docker compose --profile pool up -d`）只启动
  # 下面 `profiles: [pool]` 的 `dsh-runtime-host-{1,2,3}` + `dsh-runtime-host-lb`；
  # 同时会自动加载 `docker-compose.pool.yml`（compose 的 profile 自动包含机制），
  # 把 chat-api 重新指向 LB 并配置 replica 探测 URL。
  #
  # 两种拓扑下本服务都会被创建（YAML 服务定义与 profile 过滤是两回事：
  # profile 只决定"是否启动"，不决定"服务名是否存在"），所以 chat-api 的
  # `depends_on` 可以同时写 `dsh-runtime-host` 和 `dsh-runtime-host-lb` 而不报错；
  # 未启动拓扑下的那个服务不会阻塞等待（未启动的服务不参与 condition 判定）。
  dsh-runtime-host:
    <<: *dsh-runtime-host-template
    # 官方 dsh web 模式（DSH_WEB_MODE=1）在容器内绑定 127.0.0.1:3080（dsh
    # 官方安全设计，拒绝 0.0.0.0 绑定，见 dsh-web-app 的 startup.js 校验），
    # 因此不直接映射 3080 到宿主机——那条路走不通（端口转发到的是容器
    # 网桥 IP，不是容器内 loopback）。Web GUI 统一走 mogo-gateway nginx 的
    # /dsh-web/ location 反代（见 deploy/nginx/nginx.conf），浏览器经
    # gateway 访问 http(s)://<gateway>/dsh-web/。
    # headless host 的 8101 是内部 backend 网络端口，不对外映射。

  # Runtime Host pool for horizontal scaling (see
  # docs/open-source-productization/agent-multi-instance-evaluation.md).
  #
  # 池化拓扑：`docker compose --profile pool up -d` 启用（自动加载
  # docker-compose.pool.yml，见文件头部注释）。chat-api 经 sticky LB
  # 访问（DSH_RUNTIME_HOST_URL -> dsh-runtime-host-lb），DSH_RUNTIME_HOSTS_URL
  # 保持为空，让 nginx 用 consistent hash 把每个 session 钉到一个副本上。
  # 此模式下不要设置 DSH_RUNTIME_HOSTS_URL：chat-api 会用
  # sha256 % count 自己算路由，和 nginx 的算法不一致，请求会分裂到两套路由。
  dsh-runtime-host-1:
    <<: *dsh-runtime-host-template
    profiles:
      - pool
    environment:
      DSH_INSTANCE_ID: dsh-runtime-host-1
      # Cross-replica hand-off: the pool membership (self excluded by the
      # host) so a replica handed a runtime it does not hold can relay the
      # request to the owner instead of failing with 400.
      DSH_RUNTIME_SELF_URL: http://dsh-runtime-host-1:8101
      DSH_RUNTIME_PEERS: >-
        http://dsh-runtime-host-1:8101,
        http://dsh-runtime-host-2:8101,
        http://dsh-runtime-host-3:8101
    # M1: per-replica storage isolation. The anchor's shared
    # dsh-runtime-data volume would let two replicas write the same kernel
    # state files at once, so each replica mounts its own volume here.
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - dsh-runtime-data-1:/data/dsh-runtime

  dsh-runtime-host-2:
    <<: *dsh-runtime-host-template
    profiles:
      - pool
    environment:
      DSH_INSTANCE_ID: dsh-runtime-host-2
      # Cross-replica hand-off: the pool membership (self excluded by the
      # host) so a replica handed a runtime it does not hold can relay the
      # request to the owner instead of failing with 400.
      DSH_RUNTIME_SELF_URL: http://dsh-runtime-host-2:8101
      DSH_RUNTIME_PEERS: >-
        http://dsh-runtime-host-1:8101,
        http://dsh-runtime-host-2:8101,
        http://dsh-runtime-host-3:8101
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - dsh-runtime-data-2:/data/dsh-runtime

  dsh-runtime-host-3:
    <<: *dsh-runtime-host-template
    profiles:
      - pool
    environment:
      DSH_INSTANCE_ID: dsh-runtime-host-3
      # Cross-replica hand-off: the pool membership (self excluded by the
      # host) so a replica handed a runtime it does not hold can relay the
      # request to the owner instead of failing with 400.
      DSH_RUNTIME_SELF_URL: http://dsh-runtime-host-3:8101
      DSH_RUNTIME_PEERS: >-
        http://dsh-runtime-host-1:8101,
        http://dsh-runtime-host-2:8101,
        http://dsh-runtime-host-3:8101
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - dsh-runtime-data-3:/data/dsh-runtime

  # Sticky LB in front of the Runtime Host pool. nginx' consistent hash keeps
  # every request of one kernel session on the same host; chat-api talks to this
  # service instead of a single Runtime Host.
  dsh-runtime-host-lb:
    image: nginx:1.31.5-alpine3.24-slim
    profiles:
      - pool
    restart: unless-stopped
    volumes:
      - ./deploy/docker/dsh-runtime-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dsh-runtime-host-1:
        condition: service_healthy
      dsh-runtime-host-2:
        condition: service_healthy
      dsh-runtime-host-3:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chat-api:
    image: ${MOGO_CHAT_API_IMAGE:-${MOVO_CHAT_API_IMAGE:-ghcr.io/himovo/chat-api:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
    pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid).
    #   mode=1777 is required: Docker's tmpfs default is 0755, which the
    #   non-root container user cannot write to.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment:
      OPENAI_API_KEY: ""
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: mogo_dev
      # 数据后端开关（MongoDB → PanWeiDB 迁移，见
      # docs/mongo-to-panweidb-migration-plan.md）。默认 mongo，行为不变。
      # PanWeiDB 不在本 compose 网络内，需能通过 PANWEIDB_HOST 解析到它。
      MOGO_DATA_BACKEND: ${MOGO_DATA_BACKEND:-mongo}
      PANWEIDB_HOST: ${PANWEIDB_HOST:-host.docker.internal}
      PANWEIDB_PORT: ${PANWEIDB_PORT:-5432}
      PANWEIDB_USER: ${PANWEIDB_USER:-}
      PANWEIDB_PASSWORD: ${PANWEIDB_PASSWORD:-}
      PANWEIDB_DB: ${PANWEIDB_DB:-mogo_dev}
      PANWEIDB_SCHEMA: ${PANWEIDB_SCHEMA:-public}
      ALLOWED_ORIGINS: http://localhost:${MOGO_PORT:-${MOVO_PORT:-${ASKAI_PORT:-3000}}}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      FILE_PUBLIC_PATH_PREFIX: /askai-api/api/files
      BACKEND_INTERNAL_BASE_URL: http://chat-api:8000
      ADMIN_API_BASE_URL: http://admin-api:8100
      DOCUMENT_PROCESSING_BASE_URL: http://document-api:8200
      KNOWLEDGE_LOCAL_STORAGE_DIR: /data/knowledge-documents
      TOKEN_USAGE_PUSH_ENABLED: "false"
      AUTO_INSTALL_SYSTEM_DEPS_ON_START: "false"
      AUTO_INSTALL_PLAYWRIGHT_ON_START: "false"
      REQUEST_DEBUG_SNAPSHOT_ENABLED: "false"
      # 默认（单节点模式）：chat-api 直连裸 host。
      # 池化模式（`--profile pool`，自动加载 docker-compose.pool.yml）会用
      # ${DSH_RUNTIME_HOST_URL:-} 把本默认值覆盖掉——未设置该变量时本行留空
      # 即不生效，pool 覆盖文件提供实际值；设置该变量（例如想手动切换拓扑）
      # 时优先于覆盖文件。
      #
      # 单节点模式下不要设置 DSH_RUNTIME_HOSTS_URL；池化模式由 pool 覆盖文件
      # 单独配置。
      DSH_RUNTIME_HOST_URL: ${DSH_RUNTIME_HOST_URL:-http://dsh-runtime-host:8101}
      DSH_RUNTIME_HOSTS_URL: ${DSH_RUNTIME_HOSTS_URL:-}
      # Ownership probe targets（§12.4 option B）。单节点模式下只有一个裸
      # host，没有副本可探测，默认为空；池化模式（`--profile pool`，自动
      # 加载 docker-compose.pool.yml）注入三个副本的 URL，让 chat-api 在 LB
      # 把 session 路由到刚丢副本的副本上时（ring reshuffle、副本重启）
      # 能绕过 LB 直接问每个副本"你持有这个 session 吗"来恢复。
      DSH_RUNTIME_REPLICA_URLS: ${DSH_RUNTIME_REPLICA_URLS:-}
      # Session affinity cache. Needs a Redis URL to leave process memory.
      DSH_KERNEL_REDIS_URL: ${DSH_KERNEL_REDIS_URL:-redis://redis:6379/1}
      DSH_SESSION_AFFINITY_CACHE_TTL_SECONDS: ${DSH_SESSION_AFFINITY_CACHE_TTL_SECONDS:-7200}
      DSH_TOOL_GATEWAY_URL: http://chat-api:8000/internal/dsh/tools
      DSH_MODEL_GATEWAY_URL: http://chat-api:8000/internal/dsh/model/generate
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - askai-storage:/app/storage
      - knowledge-storage:/data/knowledge-documents
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      document-api:
        condition: service_healthy
      # chat-api 等待的是它实际连的 Runtime Host。单节点模式（默认）是裸
      # host；池化模式（`--profile pool`）由 docker-compose.pool.yml 的
      # `depends_on` 合并在上面追加 `dsh-runtime-host-lb`。YAML 对
      # depends_on 这类映射按 key 合并，同名 key 后者覆盖前者，所以这里
      # 只写裸 host 不会挡住 pool 覆盖文件的追加。
      dsh-runtime-host:
        condition: service_healthy
    networks:
      - public
      - backend
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]

  admin-api:
    image: ${MOGO_ADMIN_API_IMAGE:-${MOVO_ADMIN_API_IMAGE:-ghcr.io/himovo/admin-api:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
    pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment:
      ASKAI_ADMIN_APP_ENV: production
      ASKAI_ADMIN_MONGODB_URI: mongodb://mongo:27017
      ASKAI_ADMIN_MONGODB_DB: mogo_dev
      # 数据后端开关（MongoDB → PanWeiDB 迁移，见
      # docs/mongo-to-panweidb-migration-plan.md）。默认 mongo，行为不变。
      # PanWeiDB 不在本 compose 网络内，需能通过 PANWEIDB_HOST 解析到它。
      MOGO_DATA_BACKEND: ${MOGO_DATA_BACKEND:-mongo}
      PANWEIDB_HOST: ${PANWEIDB_HOST:-host.docker.internal}
      PANWEIDB_PORT: ${PANWEIDB_PORT:-5432}
      PANWEIDB_USER: ${PANWEIDB_USER:-}
      PANWEIDB_PASSWORD: ${PANWEIDB_PASSWORD:-}
      PANWEIDB_DB: ${PANWEIDB_DB:-mogo_dev}
      PANWEIDB_SCHEMA: ${PANWEIDB_SCHEMA:-public}
      ASKAI_ADMIN_TENANT_BOOTSTRAP_ADMIN_ENABLED: "false"
      ASKAI_ADMIN_PLATFORM_ADMIN_USERNAME: ${ASKAI_ADMIN_PLATFORM_ADMIN_USERNAME:-platform}
      ASKAI_ADMIN_PLATFORM_ADMIN_PASSWORD: ${ASKAI_ADMIN_PLATFORM_ADMIN_PASSWORD:-}
      ASKAI_ADMIN_PLATFORM_ADMIN_DISPLAY_NAME: ${ASKAI_ADMIN_PLATFORM_ADMIN_DISPLAY_NAME:-平台管理员}
      ASKAI_ADMIN_BACKEND_BASE_URL: http://chat-api:8000
      ASKAI_ADMIN_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ASKAI_ADMIN_REDIS_URL: redis://redis:6379/0
      ASKAI_ADMIN_WEAVIATE_ENDPOINT: http://weaviate:8080
      ASKAI_ADMIN_DOCUMENT_PROCESSING_BASE_URL: http://document-api:8200
      ASKAI_ADMIN_ADMIN_API_PUBLIC_BASE_URL: http://admin-api:8100
      ASKAI_ADMIN_USER_PORTAL_BASE_URL: http://localhost:${MOGO_PORT:-${MOVO_PORT:-${ASKAI_PORT:-3000}}}
      ASKAI_ADMIN_KNOWLEDGE_STORAGE_TYPE: local
      ASKAI_ADMIN_KNOWLEDGE_LOCAL_STORAGE_DIR: /data/knowledge-documents
      ASKAI_ADMIN_ADMIN_STATIC_DIR: /data/admin-static
      ASKAI_ADMIN_CORS_ORIGINS: '["http://localhost:${MOGO_PORT:-${MOVO_PORT:-${ASKAI_PORT:-3000}}}"]'
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - knowledge-storage:/data/knowledge-documents
      - admin-static:/data/admin-static
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      document-api:
        condition: service_healthy
    networks:
      - public
      - backend
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"]

  document-api:
    image: ${MOGO_DOCUMENT_API_IMAGE:-${MOVO_DOCUMENT_API_IMAGE:-ghcr.io/himovo/document-parser:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
    pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
    restart: unless-stopped
    command: ["api"]
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment: &document-environment
      MOVO_DOC_PROCESSING_APP_ENV: production
      MOVO_DOC_PROCESSING_LOCAL_STORAGE_DIR: /data/knowledge-documents
      MOVO_DOC_PROCESSING_REDIS_URL: redis://redis:6379/0
      MOVO_DOC_PROCESSING_MONGODB_URI: mongodb://mongo:27017
      MOVO_DOC_PROCESSING_MONGODB_DB: mogo_dev
      # 数据后端开关（MongoDB → PanWeiDB 迁移，见
      # docs/mongo-to-panweidb-migration-plan.md）。默认 mongo，行为不变。
      # PanWeiDB 不在本 compose 网络内，需能通过 PANWEIDB_HOST 解析到它。
      MOGO_DATA_BACKEND: ${MOGO_DATA_BACKEND:-mongo}
      PANWEIDB_HOST: ${PANWEIDB_HOST:-host.docker.internal}
      PANWEIDB_PORT: ${PANWEIDB_PORT:-5432}
      PANWEIDB_USER: ${PANWEIDB_USER:-}
      PANWEIDB_PASSWORD: ${PANWEIDB_PASSWORD:-}
      PANWEIDB_DB: ${PANWEIDB_DB:-mogo_dev}
      PANWEIDB_SCHEMA: ${PANWEIDB_SCHEMA:-public}
      MOVO_DOC_PROCESSING_WEAVIATE_ENDPOINT: http://weaviate:8080
      MOVO_DOC_PROCESSING_WEAVIATE_COLLECTION_NAME: AskAIKnowledgeChunks
      MOVO_DOC_PROCESSING_WEAVIATE_DISTANCE_METRIC: cosine
      MOVO_DOC_PROCESSING_AZURE_EMBEDDING_ENDPOINT: ${AZURE_EMBEDDING_ENDPOINT:-}
      MOVO_DOC_PROCESSING_AZURE_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_EMBEDDING_DEPLOYMENT_NAME:-text_embedding}
      MOVO_DOC_PROCESSING_AZURE_EMBEDDING_API_VERSION: ${AZURE_EMBEDDING_API_VERSION:-2025-04-01-preview}
      MOVO_DOC_PROCESSING_AZURE_EMBEDDING_API_KEY: ${AZURE_EMBEDDING_API_KEY:-}
      MOVO_DOC_PROCESSING_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - knowledge-storage:/data/knowledge-documents
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks:
      - public
      - backend
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=3).read()"]

  document-worker:
    image: ${MOGO_DOCUMENT_WORKER_IMAGE:-${MOVO_DOCUMENT_WORKER_IMAGE:-ghcr.io/himovo/document-parser:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
    pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
    restart: unless-stopped
    command: ["worker"]
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment: *document-environment
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - knowledge-storage:/data/knowledge-documents
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks:
      - public
      - backend

  user-web:
    image: ${MOGO_USER_WEB_IMAGE:-${MOVO_USER_WEB_IMAGE:-ghcr.io/himovo/user-web:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
    pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # nginx still needs to bind port 80, which is below the unprivileged range.
    # Grant exactly that one capability instead of running the whole container
    # as root (see apps/user-web/Dockerfile.prod).
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      # nginx keeps its client-body / proxy / cache scratch areas and its log
      # files outside the image rootfs, so with read_only: true they must be
      # explicit tmpfs mounts. Without this nginx exits at startup with
      # `mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)`.
      - /var/cache/nginx:rw,nosuid,nodev,size=128m,mode=0777
      - /var/log/nginx:rw,nosuid,nodev,size=64m,mode=0777
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  admin-web:
    image: ${MOGO_ADMIN_WEB_IMAGE:-${MOVO_ADMIN_WEB_IMAGE:-ghcr.io/himovo/admin-web:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
    pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # nginx still needs to bind port 80, which is below the unprivileged range.
    # Grant exactly that one capability instead of running the whole container
    # as root (see apps/admin-web/Dockerfile).
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      # nginx keeps its client-body / proxy / cache scratch areas and its log
      # files outside the image rootfs, so with read_only: true they must be
      # explicit tmpfs mounts. Without this nginx exits at startup with
      # `mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)`.
      - /var/cache/nginx:rw,nosuid,nodev,size=128m,mode=0777
      - /var/log/nginx:rw,nosuid,nodev,size=64m,mode=0777

    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    image: ${MOGO_GATEWAY_IMAGE:-${MOVO_GATEWAY_IMAGE:-ghcr.io/himovo/gateway:${MOGO_VERSION:-${MOVO_VERSION:-latest}}}}
    pull_policy: ${MOGO_PULL_POLICY:-${MOVO_PULL_POLICY:-missing}}
    restart: unless-stopped
    # 022 US3 (T027): gateway 是 nginx，同样加固。它还要做 TLS 终结并绑定低
    # 端口，所以保留唯一必要的一项 capability。
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      # nginx keeps its client-body / proxy / cache scratch areas and its log
      # files outside the image rootfs, so with read_only: true they must be
      # explicit tmpfs mounts. Without this nginx exits at startup with
      # `mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)`.
      - /var/cache/nginx:rw,nosuid,nodev,size=128m,mode=0777
      - /var/log/nginx:rw,nosuid,nodev,size=64m,mode=0777

    ports:
      - "${MOGO_PORT:-${MOVO_PORT:-${ASKAI_PORT:-3000}}}:80"
      # 022 FR-17 / T037：暴露 443。80 端口的 HTTP 配置会 301 到 HTTPS
      # （见 deploy/docker/nginx-https.conf），生产端口固定为 443。
      # 未切换 TLS 配置时 443 只是空闲监听，不影响 HTTP 访问。
      - "${MOGO_HTTPS_PORT:-443}:443"
    volumes:
      # 022 FR-17 / T037：网关默认启用 TLS（gateway 容器 read_only，无法运行时
      # 生成配置，必须在挂载层切换）。TLS 三步：
      #   1. 证书落到 MOGO_TLS_CERTS_DIR（默认 ./deploy/tls）：
      #      fullchain.pem / privkey.pem。私钥必须 0644：网关以非 root(UID 10001)
      #      运行，Linux 上 bind mount 保留宿主 uid，0600 会让 nginx 启动即
      #      `cannot load certificate key ... (13: Permission denied)`。
      #      ⚠️ 证书不入库（deploy/tls/.gitignore），全新克隆必须先放证书，
      #      否则网关会因缺证书 crash-loop。自签：
      #        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      #          -keyout deploy/tls/privkey.pem -out deploy/tls/fullchain.pem \
      #          -subj "/CN=localhost" \
      #          -addext "subjectAltName = DNS:localhost,IP:127.0.0.1"
      #        chmod 0644 deploy/tls/privkey.pem deploy/tls/fullchain.pem
      #   2. 网关配置的**唯一事实来源**是 deploy/nginx/nginx.conf（TLS 侧），
      #      它也是下面的默认值。（deploy/docker/nginx-https.conf 为兼容入口，
      #      内容等价，由测试钉住。）
      #   3. 改完配置只需重建 gateway 容器，不必重建镜像（配置是挂载进去的）：
      #        MOGO_GATEWAY_IMAGE="$(docker inspect mogo-gateway-1 \
      #          --format '{{.Config.Image}}')" \
      #          docker compose up -d --no-deps gateway
      #      裸 `docker compose up -d gateway` 缺镜像名，会解析成
      #      ghcr.io/himovo/gateway:latest 去拉远端镜像（可能覆盖本地构建）。
      #      完整步骤见 deploy/tls/README.md。
      # 回退到 HTTP（仅限本地/内网调试）：把 MOGO_NGINX_CONF 指向
      # ./deploy/docker/nginx.conf，或写进 .env 让后续 up 都生效。
      # TLS 侧配置含：HTTP→HTTPS 301（/healthz 豁免）、TLSv1.2/1.3、HSTS、安全响应头。
      - ${MOGO_NGINX_CONF:-./deploy/nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates — create deploy/tls/ with fullchain.pem and privkey.pem
      - ${MOGO_TLS_CERTS_DIR:-./deploy/tls}:/etc/nginx/certs:ro
    depends_on:
      chat-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      user-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    networks:
      - public
      # backend 只用于 /dsh-web/ 反代（转发到 dsh-runtime-host:3080，
      # 该服务只在 backend 网络）；其余上游（user-web/admin-web/
      # admin-api/chat-api）都在 public 网络。
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  public:
  backend:
    internal: true

volumes:
  # Community installations use their own physical volumes. Override the
  # prefix for an isolated validation run without touching another install.
  deployment-secrets:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_deployment-secrets
  mongo-data:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_mongo-data
  redis-data:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_redis-data
  weaviate-data:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_weaviate-data
  dsh-runtime-data:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_dsh-runtime-data
  # Per-replica storage isolation (§ M1). Each pool replica gets its own
  # volume so kernel state (session JSONL, workspace registry) cannot be
  # written by two replicas at once. Cross-replica recovery of a session
  # whose data lives on another replica's volume goes through the §12.4
  # seed-migration path (probe owner -> export sealed seed -> rebuild), not
  # through reading the JSONL directly.
  dsh-runtime-data-1:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_dsh-runtime-data-1
  dsh-runtime-data-2:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_dsh-runtime-data-2
  dsh-runtime-data-3:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_dsh-runtime-data-3
  askai-storage:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_askai-storage
  knowledge-storage:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_knowledge-storage
  admin-static:
    name: ${MOGO_VOLUME_PREFIX:-${MOVO_VOLUME_PREFIX:-movo}}_admin-static
