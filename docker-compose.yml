name: mogo

x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 30s

# The DSH Runtime Host owns kernel session state in process memory, so one
# kernel_session_id must always reach the same instance.
#
# Two mutually exclusive topologies share this template, switched by compose
# profiles (single host is the default; pool is opt-in):
#
#   * single host (default) — one bare host, for minimal self-hosted
#     deployments. Started by plain `docker compose up -d` (no profile).
#     chat-api talks to it directly.
#   * pool — ``dsh-runtime-host-{1,2,3}`` behind the sticky LB.
#     Enable with `docker compose --profile pool up -d`; this also loads
#     `docker-compose.pool.yml` (auto-included when the `pool` profile is
#     active), which repoints chat-api at the LB and sets up replica URLs.
#
# `x-dsh-runtime-host-template` holds the settings both topologies inherit.
# The pool replicas and the LB carry their own `profiles: [pool]` entry:
# putting `profiles` inside the anchor would be merged into every service
# that inherits it (a YAML merge key copies the whole mapping), so the
# single-host service must stay profile-free to remain the default.
x-dsh-runtime-host-template: &dsh-runtime-host-template
  image: ${MOGO_DSH_RUNTIME_HOST_IMAGE:-ghcr.io/mogoai/dsh-runtime-host:${MOGO_VERSION:-latest}}
  pull_policy: ${MOGO_PULL_POLICY:-missing}
  restart: unless-stopped
  # R1: on SIGTERM the host first drains (waits up to 30s for in-flight
  # turns to finish) before disposing runtimes. The grace period must cover
  # that drain window or docker kills the process and the drain is cut off.
  stop_grace_period: 45s
  # 022 US3 (T027): container hardening, same shape as the other app services.
  # The image declares `USER node`, so `cap_drop: ALL` costs nothing: there is
  # no privilege drop at start-up and therefore no CAP_SETUID/CAP_SETGID needed.
  # Everything the host writes at runtime already lives outside the image:
  #   * kernel sessions / workspaces -> the dsh-runtime-data volume
  #   * $HOME/.dsh (anonymous user id) -> HOME is pinned into that same volume
  #   * the cordis host profile -> tmpfs (regenerated on every boot)
  #   * scratch -> tmpfs /tmp
  # so `read_only` is safe. tmpfs entries must state mode explicitly: Docker's
  # default is 0755, which the non-root user cannot write to.
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    # The cordis host profile is rewritten from config on every boot, so it
    # needs writable space but no persistence.
    - /app/host-profile-home:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0755
  # Linux 可移植性：让容器经 host.docker.internal 访问宿主机服务（如本机模型网关）。
  # Docker Desktop / OrbStack 已内置该域名（此条为幂等覆盖，实测仍解析到 OrbStack 的
  # 0.250.250.254）；Linux Docker 20.10+ 必须靠 host-gateway 才能解析。
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    DSH_INSTANCE_ID: dsh-runtime-host
    # 官方 dsh web 模式开关（可选，默认关闭）：
    #   DSH_WEB_MODE=1           额外启动 `dsh --profile web`，把官方 Web GUI 暴露出来
    #   DSH_WEB_HOST=127.0.0.1   web 绑定地址（默认 127.0.0.1；dsh 有意拒绝
    #                            0.0.0.0，属官方安全设计，不要改）
    #   DSH_WEB_PORT=3080        web 端口（默认 3080，与 headless host 的 8101 互不影响）
    #   DSH_WEB_TRUSTED_HOST=    额外信任的 Host 值（逗号分隔），仅在部署到
    #                            非 localhost/127.0.0.1 的主机名/公网域名后需要；
    #                            localhost/127.0.0.1 访问永远被 dsh 的 browser-
    #                            trust fence 识别为 loopback，无需配置。
    # 不设置 DSH_WEB_MODE 时行为与旧镜像完全一致，仅运行 headless host。
    #
    # Web GUI 的对外暴露路径：mogo-gateway nginx 的 /dsh-web/ location
    # （见 deploy/nginx/nginx.conf），浏览器访问 http(s)://<gateway>/dsh-web/。
    # 不直接映射 3080 到宿主机——那种映射转发到的是容器网桥 IP 而非容器内
    # loopback，对 127.0.0.1 绑定无效（已实测确认）。
    DSH_WEB_MODE: ${DSH_WEB_MODE:-0}
    # /tmp 在容器内是 noexec tmpfs，native cache 把 .node 二进制拷到
    # /tmp 后加载会失败（failed to map segment from shared object）。
    # 禁用 native cache，直接从原始路径加载。
    NARB_DISABLE_NATIVE_CACHE: "1"
  volumes:
    - deployment-secrets:/run/askai-secrets:ro
    - dsh-runtime-data:/data/dsh-runtime
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  networks:
    - public
    - backend
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        set -a; . /run/askai-secrets/runtime.env; set +a;
        node -e "fetch('http://127.0.0.1:8101/health',{headers:{authorization:'Bearer '+process.env.DSH_RUNTIME_HOST_TOKEN}}).then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(v=>{if(v.ok!==true||v.kernel!=='dsh')process.exit(1)}).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 20s

services:
  bootstrap:
    image: alpine:3.21
    restart: "no"
    # 022 US3 (T027): the bootstrap container generates secrets into a
    # named volume and fixes the ownership of the writable app volumes, so it
    # needs no privileges other than CHOWN/FOWNER for that last step.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    environment:
      MOGO_PORT: ${MOGO_PORT:-3000}
    volumes:
      - deployment-secrets:/run/askai-secrets
      # 027 P2 修复（2026-10-20）：三个可写卷必须由应用进程（UID 10001）可写，
      # 否则 admin-api / chat-api / document-api（均以 appuser 运行）的
      # 知识存储 / 静态资源 / 会话产物落盘会失败，setup/status 的 storage
      # 健康项也恒为 false。
      #
      # 为什么需要这里而不是依赖 Docker 的卷初始化行为：
      #   Docker 只在卷**首次创建且为空**时，用镜像里对应路径的内容（含
      #   属主）初始化它。当前默认卷名是 mogo_*（如 mogo_knowledge-storage），
      #   属主 10001:10001；但升级自更早部署的卷可能仍是 root:root 0755，
      #   后续重建镜像不会修正已有卷的属主。因此由 bootstrap 在每次启动
      #   前做一次幂等的 chown（卷已是 10001 时 chown 无副作用）。
      - knowledge-storage:/storage/knowledge
      - admin-static:/storage/admin-static
      - askai-storage:/storage/askai
    command:
      - /bin/sh
      - -ec
      - |
        # 022 US3 (T027): runtime.env 必须 0644。应用容器内的进程以非 root
        # 用户 appuser (UID 10001) 运行（见各 Dockerfile），0600 会让它们
        # 读不到自己的密钥。卷本身只在 docker 网络内以 :ro 挂载，不会暴露到宿主机。
        umask 022
        secret_file=/run/askai-secrets/runtime.env
        random_hex() { head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        if [ ! -s "$$secret_file" ]; then
          admin_secret="$$(random_hex)"
          admin_backend_service_token="$$(random_hex)"
          document_service_token="$$(random_hex)"
          document_callback_token="$$(random_hex)"
          temp_file="$${secret_file}.tmp"
          {
            echo "END_USER_AUTH_SECRET=$$(random_hex)"
            echo "ASKAI_ADMIN_JWT_SECRET=$$admin_secret"
            echo "ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
            echo "ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
            echo "MODEL_CONFIG_SECRET=$$admin_secret"
            echo "DSH_MODEL_GATEWAY_SIGNING_SECRET=$$(random_hex)"
            echo "DSH_RUNTIME_HOST_TOKEN=$$(random_hex)"
            echo "DOCUMENT_PROCESSING_SERVICE_TOKEN=$$document_service_token"
            echo "ASKAI_ADMIN_DOCUMENT_PROCESSING_SERVICE_TOKEN=$$document_service_token"
            echo "MOGO_DOC_PROCESSING_SERVICE_TOKEN=$$document_service_token"
            echo "ASKAI_ADMIN_DOCUMENT_PROCESSING_CALLBACK_TOKEN=$$document_callback_token"
            echo "MOGO_DOC_PROCESSING_CALLBACK_TOKEN=$$document_callback_token"
            echo "MOGO_DOC_PROCESSING_ADMIN_JWT_SECRET=$$admin_secret"
          } > "$$temp_file"
          mv "$$temp_file" "$$secret_file"
        fi
        if ! grep -q '^DSH_RUNTIME_HOST_TOKEN=' "$$secret_file"; then
          temp_file="$${secret_file}.tmp"
          cp "$$secret_file" "$$temp_file"
          echo "DSH_RUNTIME_HOST_TOKEN=$$(random_hex)" >> "$$temp_file"
          mv "$$temp_file" "$$secret_file"
        fi
        admin_backend_service_token="$$(sed -n 's/^ADMIN_BACKEND_SERVICE_TOKEN=//p' "$$secret_file" | head -n 1)"
        if [ -z "$$admin_backend_service_token" ]; then
          admin_backend_service_token="$$(sed -n 's/^ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=//p' "$$secret_file" | head -n 1)"
        fi
        if [ -z "$$admin_backend_service_token" ]; then
          admin_backend_service_token="$$(random_hex)"
        fi
        temp_file="$${secret_file}.tmp"
        sed '/^ADMIN_BACKEND_SERVICE_TOKEN=/d; /^ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=/d' "$$secret_file" > "$$temp_file"
        {
          echo "ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
          echo "ASKAI_ADMIN_BACKEND_SERVICE_TOKEN=$$admin_backend_service_token"
        } >> "$$temp_file"
        mv "$$temp_file" "$$secret_file"
        # 027 P2 修复（2026-10-20）：可写卷的属主兜底。
        # 当前默认卷名为 mogo_knowledge-storage、mogo_admin-static、
        # mogo_askai-storage，属主 10001:10001；升级自更早部署的卷可能仍是
        # root:root 0755，应用容器以
        # appuser (UID 10001) 运行无法写入。这里在启动前做一次幂等 chown；
        # 卷已属 10001 时无副作用。挂载到 /storage/* 而非 /data/* 是因为
        # 镜像的 /data 路径在 rootfs 上（read_only 且与卷挂载点同名易混淆），
        # bootstrap 只用 alpine，挂载点只在本容器内有效。
        chown -R 10001:10001 /storage/knowledge /storage/admin-static /storage/askai
        echo "MOGO deployment secrets are ready."
        echo "After services become healthy, open http://localhost:$${MOGO_PORT:-3000}/admin/setup"

  mongo:
    # 与 panweidb 一样留环境变量覆盖口：升级/回滚只改 .env 或命令行，不改本文件。
    # 版本不能跳级：MongoDB 只接受「上一代 FCV 或本代 FCV」，6.0 数据必须
    # 6.0 → 7.0 → 8.0 → 8.3 逐级升（每步先换二进制，再 setFeatureCompatibilityVersion）。
    #
    # 连接信息是 `MOGO_MONGODB_URI` / `MOGO_MONGODB_DB`（见 .env.example），
    # 默认指向本服务名 `mongo`；要用外部已有的 MongoDB，只需在 .env 里改这两个
    # 变量，应用会改连外部实例（不需要这个容器）。生产环境再配合
    # `MOGO_USE_EXTERNAL_DB=1`（docker-compose.external.yml）把栈内 mongo / redis /
    # panweidb 一起排除出拓扑。
    image: ${MOGO_MONGO_IMAGE:-mongo:8.3.13}
    restart: unless-stopped
    # T011：MongoDB 所有持久化写都落在命名卷 /data/db（mongod 的 dbpath 与 journal）
    # 与 /backups 内；根文件系统改为只读安全。`tmpfs /tmp` 兜底 mongod 的临时目录。
    # 注意：单机模式不写 /data/configdb；若启用 `--configsvr` 需另挂 configdb 卷。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - mongo-data:/data/db
      # T101：备份卷。备份产物（密文 + 清单 + 校验和）落在这里，容器与宿主机
      # 都能看到；不随 `docker compose down` 消失。这个卷必须放在**加密盘**上
      # （云厂商加密 EBS / LUKS 挂载点 / dm-crypt），理由与做法见
      # docs/runbooks/disaster-recovery.md「备份卷加密」一节：AES-256 只保护
      # 备份内容，卷泄漏仍会暴露文件名、集合规模与备份时序。
      - mongo-backup:/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ── 024 T074 (FR-039)：MongoDB 副本集（HA）选项 ──────────────────────────
  # 默认**关闭**：挂在 `ha` profile 上，只有 `docker compose --profile ha up -d`
  # 才进拓扑。启用后 `mongo-ha` 与 `mongo-ha-init` 替代单机 `mongo` 提供数据层，
  # 二者与单机 mongo **共用 `mongo-data` 卷**（同一份 dbpath，不可同时运行）。
  #
  # 启用步骤（详见 deploy/runbook/failover-runbook.md）：
  #   1. 生成副本集认证 keyfile：
  #        mkdir -p secrets && openssl rand -base64 756 | tr -d '\n' > secrets/mongo_keyfile
  #        chmod 600 secrets/mongo_keyfile
  #   2. docker compose --profile ha up -d mongo-ha mongo-ha-init
  #   3. 验证：mongosh --eval "rs.status().ok"  == 1
  #
  # 关键点：`--keyFile` 必须启用内网认证（否则 rs.add 被拒）；keyfile 内容
  # **不提交仓库**，缺失时服务起不来（宁可失败，不静默降级为无认证副本集）。
  mongo-ha:
    image: ${MOGO_MONGO_IMAGE:-mongo:8.3.13}
    restart: unless-stopped
    profiles: ["ha"]
    command:
      - mongod
      - --replSet
      - rs0
      - --keyFile
      - /run/secrets/mongo_keyfile
      - --bind_ip_all
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - mongo-data:/data/db
      - mongo-backup:/backups
    secrets:
      - mongo_keyfile
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({replSetGetStatus:1}).myState==1 || db.adminCommand({replSetGetStatus:1}).myState==2"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 初始化容器：以单节点副本集启动（rs.initiate），后续按 failover-runbook
  # 用 rs.add 扩到多节点。容器一次性任务，成功后退出。
  mongo-ha-init:
    image: ${MOGO_MONGO_IMAGE:-mongo:8.3.13}
    profiles: ["ha"]
    depends_on:
      mongo-ha:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        until mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 2; done
        mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo-ha:27017'}]}).ok }"
    networks:
      - backend

  # PanWeiDB 3.2.0（openGauss 内核）——MongoDB → PanWeiDB 迁移的目标库。
  #
  # 与 mongo / redis / weaviate 不同，这个服务默认**不启动**：它挂在 `panweidb`
  # profile 上，只有显式启用才进拓扑。原因是镜像 `panweidb:3.2.0` 只在本地
  # （arm64，来自 base-images/images/arm64/panweidb_3.2.0.tar），公共部署里根本
  # 拉不到；而 `.env` 的 `MOGO_DATA_BACKEND` 默认仍是 mongo。启用方式：
  #
  #     MOGO_DATA_BACKEND=panweidb docker compose --profile panweidb up -d
  #
  # 上面两个开关都要给：profile 决定容器是否进拓扑，`MOGO_DATA_BACKEND` 决定应用
  # 连哪个后端（见 services/*/app/core/config.py）。只开 profile 不改后端，库会
  # 空转；只改后端不开 profile，应用会连不上 PanWeiDB。
  #
  # 生命周期一体化：之前 PanWeiDB 是手工 `docker run --privileged ... -c 'tail -f
  # /dev/null'` 起来的空转容器，数据库进程要人在外面 `gs_ctl start` 才有；容器
  # 重启 = 数据库消失，`docker compose down` 更会把它连数据一起删（数据在可写层，
  # 没有卷）。现在：
  #   * 数据落在命名卷 `panweidb-storage`（挂 /database/panweidb），可重建容器；
  #   * `deploy/panweidb/entrypoint.sh` 作为 PID 1 supervisor 负责解包二进制、
  #     首次 gs_initdb、gs_ctl start、探活守命，并在 SIGTERM 时 `gs_ctl stop -m
  #     fast` 干净关库 —— 所以 `docker compose up/down/restart` 一套命令就够。
  #
  # 为什么 privileged：openGauss/PanWeiDB 需要 `kernel.sched_*`、大共享内存等
  # sysctl 写权限与直接 shm 操作，镜像上游文档即要求 --privileged（原容器也是这么
  # 跑的）。这使它成为本文件里**唯一**不做 cap_drop/read_only 加固的服务；它只挂在
  # backend + 宿主机回环端口上，不对外暴露。见 docs/mongo-to-panweidb-migration-plan.md。
  # T101/T102：备份执行器。
  #
  # 为什么不把 cron 塞进 mongo 容器：mongo 官方镜像没有 cron，且数据库容器
  # 重启/kill 时不能连带把备份进程拦腰截断——备份要和库同一个生命周期之外
  # 独立起落。这里直接复用 mongo 镜像（自带 mongodump/mongorestore/mongosh，
  # 版本与库一致，避免 mongodump 版本高于 server 时的兼容问题）。
  #
  # 默认不启动（profile: backup）：只在真正需要自动备份的部署里开。
  #     docker compose --profile backup up -d mongo-backup
  #
  # 口令**不进镜像、不进 compose 文件、不进 .env**：走 docker secret 或宿主机
  # 文件，由 `MOGO_BACKUP_PASSPHRASE_FILE` 指过去（T102）。两者都没有时备份
  # 脚本会直接失败，而不是回退到内置口令——见 scripts/backup/lib.sh 的
  # `mogo_backup_passphrase_source`。
  mongo-backup:
    image: ${MOGO_MONGO_IMAGE:-mongo:8.3.13}
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/mogo/scripts/backup/container_run.sh"]
    environment:
      MOGO_MONGODB_URI: ${MOGO_BACKUP_MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0}
      MOGO_MONGODB_DB: ${MOGO_MONGODB_DB:-mogo}
      MOGO_BACKUP_DIR: /backups
      # secret 的默认挂载点；宿主机文件方案可在 .env 里覆盖成 /etc/mogo/backup.pass。
      MOGO_BACKUP_PASSPHRASE_FILE: ${MOGO_BACKUP_PASSPHRASE_FILE:-/run/secrets/mongo_backup_passphrase}
      # 异地：目录（共享存储/rsync 目标）或 rclone remote，二选一或都不配。
      MOGO_BACKUP_OFFSITE_DIR: ${MOGO_BACKUP_OFFSITE_DIR:-/backups/offsite}
      MOGO_BACKUP_OFFSITE_RCLONE_REMOTE: ${MOGO_BACKUP_OFFSITE_RCLONE_REMOTE:-}
      MOGO_BACKUP_KEEP_MIN: ${MOGO_BACKUP_KEEP_MIN:-2}
      MOGO_BACKUP_LOCAL_DAYS: ${MOGO_BACKUP_LOCAL_DAYS:-30}
      MOGO_BACKUP_OFFSITE_DAYS: ${MOGO_BACKUP_OFFSITE_DAYS:-90}
      # 演练预算只用于评估，不拦截执行（见 docs/observability/rto-rpo.md）。
      MOGO_RTO_BUDGET_SECONDS: ${MOGO_RTO_BUDGET_SECONDS:-1800}
      MOGO_RPO_BUDGET_SECONDS: ${MOGO_RPO_BUDGET_SECONDS:-900}
      TZ: UTC
    volumes:
      - mongo-backup:/backups
      # 脚本只读挂进容器；镜像里不带备份逻辑，改脚本不用重建镜像。
      - ./scripts:/opt/mogo/scripts:ro
    secrets:
      - mongo_backup_passphrase
    networks:
      - backend
    healthcheck:
      # 备份器没有监听端口，健康 = 上次成功运行在预期窗口内。
      # container_run.sh 每次成功都会刷新 /backups/.last-success。
      test:
        [
          "CMD-SHELL",
          "test -f /backups/.last-success && test $(( $(date +%s) - $(cat /backups/.last-success) )) -lt 7200",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # 备份不能和库抢 IO：给一个软上限，避免全量 dump 期间把 chat-api 拖垮。
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  panweidb:
    image: ${MOGO_PANWEIDB_IMAGE:-panweidb:3.2.0}
    # 本地镜像（离线交付从 base-images load 进来），不要让 compose 去 registry 找。
    pull_policy: never
    profiles:
      - panweidb
    restart: unless-stopped
    # gs_ctl stop -m fast 会等在途事务收敛；给足窗口，别让 docker 用 KILL 打断，
    # 否则卷里留下 crash recovery 状态，下次启动要回放 WAL。
    stop_grace_period: 90s
    # 与 mongo 同样的定位：只在 backend 网络里被应用访问。挂 public 的唯一目的是
    # 让宿主机端口发布生效——backend 是 internal 网络，internal 上发布的端口宿主
    # 侧不可达（实测），而 scripts/pg/*.py、deploy/tests 里的宿主工具都按
    # 127.0.0.1:5432 连库（见 scripts/pg/dev-forward/README.md 记录的同一限制）。
    networks:
      - public
      - backend
    # 默认只绑回环：这个库的 pg_hba 远程段是 sha256 口令认证，且账号口令写在 .env 里，
    # 绑到 0.0.0.0 等于把口令暴露在本机网段。确实需要局域网访问时显式设
    # MOGO_PANWEIDB_BIND=0.0.0.0。
    ports:
      - "${MOGO_PANWEIDB_BIND:-127.0.0.1}:${MOGO_PANWEIDB_PORT:-5432}:5432"
    environment:
      PANWEIDB_PORT: "5432"
      # 首次初始化（空卷）时用这几个值建应用账号/库/schema；已有数据卷不会改动账号。
      # 应用真正连接的口令由 chat-api 等服务的 PANWEIDB_* 决定，见下面各服务。
      PANWEIDB_ADMIN_PASSWORD: ${PANWEIDB_ADMIN_PASSWORD:-}
      PANWEIDB_USER: ${PANWEIDB_USER:-}
      PANWEIDB_PASSWORD: ${PANWEIDB_PASSWORD:-}
      PANWEIDB_DB: ${PANWEIDB_DB:-mogo_dev}
      PANWEIDB_SCHEMA: ${PANWEIDB_SCHEMA:-mogo_dev}
    volumes:
      - panweidb-storage:/database/panweidb
      - ./deploy/panweidb/entrypoint.sh:/usr/local/bin/mogo-panweidb-entrypoint.sh:ro
    # 镜像自带 entrypoint 会去起 systemd（数据库进程并不会跟着起来），必须换掉。
    entrypoint: ["bash", "/usr/local/bin/mogo-panweidb-entrypoint.sh"]
    privileged: true
    healthcheck:
      # 只探 TCP：gs_ctl status 依赖口令/环境，端口可达才是「库能提供服务」的准确信号。
      test: ["CMD-SHELL", "python3 -c \"import socket,sys;sys.exit(0 if socket.create_connection(('127.0.0.1',5432),3) else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 60
      # 首次启动要从镜像里的安装包解包二进制（~1.6G）再 gs_initdb，给足时间。
      start_period: 300s

  redis:
    # 与 mongo / panweidb 一样留环境变量覆盖口：升级/回滚只改 .env，不改本文件。
    image: ${MOGO_REDIS_IMAGE:-redis:7.4.2-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # T011：AOF 与 RDB 全部落在命名卷 /data 内；根文件系统只读安全。
    # redis 自身无 /tmp 依赖，但 `redis-server` 的信号/pid 文件在编译期指向 /tmp，
    # 显式给 tmpfs 兜底，避免只读根下 pidfile 写失败。
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  weaviate:
    # 版本可覆盖：本地/自建镜像仓库没有官方 tag 时，用 MOGO_WEAVIATE_IMAGE 指到
    # 自己的镜像（例如 registry 内网镜像 semitechnologies/weaviate:1.25.7）。
    image: ${MOGO_WEAVIATE_IMAGE:-semitechnologies/weaviate:1.25.7}
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"
    # T011：Weaviate 持久化全部落在命名卷 /var/lib/weaviate（PERSISTENCE_DATA_PATH）；
    # 根文件系统只读安全。`tmpfs /tmp` 兜底索引/导入的临时写入。
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 单节点拓扑（默认）：一个裸 host，最小化自托管部署用。
  #
  # 无 profile，普通 `docker compose up -d` / `./mogo up` 即启动。
  # chat-api 默认直连它（DSH_RUNTIME_HOST_URL -> dsh-runtime-host:8101）。
  #
  # 池化拓扑（opt-in，`docker compose --profile pool up -d`）只启动
  # 下面 `profiles: [pool]` 的 `dsh-runtime-host-{1,2,3}` + `dsh-runtime-host-lb`；
  # 同时会自动加载 `docker-compose.pool.yml`（compose 的 profile 自动包含机制），
  # 把 chat-api 重新指向 LB 并配置 replica 探测 URL。
  #
  # 两种拓扑下本服务都会被创建（YAML 服务定义与 profile 过滤是两回事：
  # profile 只决定"是否启动"，不决定"服务名是否存在"），所以 chat-api 的
  # `depends_on` 可以同时写 `dsh-runtime-host` 和 `dsh-runtime-host-lb` 而不报错；
  # 未启动拓扑下的那个服务不会阻塞等待（未启动的服务不参与 condition 判定）。
  dsh-runtime-host:
    <<: *dsh-runtime-host-template
    # 官方 dsh web 模式（DSH_WEB_MODE=1）在容器内绑定 127.0.0.1:3080（dsh
    # 官方安全设计，拒绝 0.0.0.0 绑定，见 dsh-web-app 的 startup.js 校验），
    # 因此不直接映射 3080 到宿主机——那条路走不通（端口转发到的是容器
    # 网桥 IP，不是容器内 loopback）。Web GUI 统一走 mogo-gateway nginx 的
    # /dsh-web/ location 反代（见 deploy/nginx/nginx.conf），浏览器经
    # gateway 访问 http(s)://<gateway>/dsh-web/。
    # headless host 的 8101 是内部 backend 网络端口，不对外映射。

  # Runtime Host pool for horizontal scaling (see
  # docs/open-source-productization/agent-multi-instance-evaluation.md).
  #
  # 池化拓扑：`docker compose --profile pool up -d` 启用（自动加载
  # docker-compose.pool.yml，见文件头部注释）。chat-api 经 sticky LB
  # 访问（DSH_RUNTIME_HOST_URL -> dsh-runtime-host-lb），DSH_RUNTIME_HOSTS_URL
  # 保持为空，让 nginx 用 consistent hash 把每个 session 钉到一个副本上。
  # 此模式下不要设置 DSH_RUNTIME_HOSTS_URL：chat-api 会用
  # sha256 % count 自己算路由，和 nginx 的算法不一致，请求会分裂到两套路由。
  dsh-runtime-host-1:
    <<: *dsh-runtime-host-template
    profiles:
      - pool
    environment:
      DSH_INSTANCE_ID: dsh-runtime-host-1
      # Cross-replica hand-off: the pool membership (self excluded by the
      # host) so a replica handed a runtime it does not hold can relay the
      # request to the owner instead of failing with 400.
      DSH_RUNTIME_SELF_URL: http://dsh-runtime-host-1:8101
      DSH_RUNTIME_PEERS: >-
        http://dsh-runtime-host-1:8101,
        http://dsh-runtime-host-2:8101,
        http://dsh-runtime-host-3:8101
    # M1: per-replica storage isolation. The anchor's shared
    # dsh-runtime-data volume would let two replicas write the same kernel
    # state files at once, so each replica mounts its own volume here.
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - dsh-runtime-data-1:/data/dsh-runtime

  dsh-runtime-host-2:
    <<: *dsh-runtime-host-template
    profiles:
      - pool
    environment:
      DSH_INSTANCE_ID: dsh-runtime-host-2
      # Cross-replica hand-off: the pool membership (self excluded by the
      # host) so a replica handed a runtime it does not hold can relay the
      # request to the owner instead of failing with 400.
      DSH_RUNTIME_SELF_URL: http://dsh-runtime-host-2:8101
      DSH_RUNTIME_PEERS: >-
        http://dsh-runtime-host-1:8101,
        http://dsh-runtime-host-2:8101,
        http://dsh-runtime-host-3:8101
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - dsh-runtime-data-2:/data/dsh-runtime

  dsh-runtime-host-3:
    <<: *dsh-runtime-host-template
    profiles:
      - pool
    environment:
      DSH_INSTANCE_ID: dsh-runtime-host-3
      # Cross-replica hand-off: the pool membership (self excluded by the
      # host) so a replica handed a runtime it does not hold can relay the
      # request to the owner instead of failing with 400.
      DSH_RUNTIME_SELF_URL: http://dsh-runtime-host-3:8101
      DSH_RUNTIME_PEERS: >-
        http://dsh-runtime-host-1:8101,
        http://dsh-runtime-host-2:8101,
        http://dsh-runtime-host-3:8101
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - dsh-runtime-data-3:/data/dsh-runtime

  # Sticky LB in front of the Runtime Host pool. nginx' consistent hash keeps
  # every request of one kernel session on the same host; chat-api talks to this
  # service instead of a single Runtime Host.
  dsh-runtime-host-lb:
    image: nginx:1.31.5-alpine3.24-slim
    profiles:
      - pool
    restart: unless-stopped
    volumes:
      - ./deploy/docker/dsh-runtime-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dsh-runtime-host-1:
        condition: service_healthy
      dsh-runtime-host-2:
        condition: service_healthy
      dsh-runtime-host-3:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chat-api: &chat-api-def
    image: ${MOGO_CHAT_API_IMAGE:-ghcr.io/mogoai/chat-api:${MOGO_VERSION:-latest}}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid).
    #   mode=1777 is required: Docker's tmpfs default is 0755, which the
    #   non-root container user cannot write to.
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment:
      OPENAI_API_KEY: ""
      MONGODB_URI: ${MOGO_MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MOGO_MONGODB_DB:-mogo_dev}
      # 数据后端开关（MongoDB → PanWeiDB 迁移，见
      # docs/mongo-to-panweidb-migration-plan.md）。默认 mongo，行为不变。
      # PanWeiDB 现在就在本 compose 网络内（`panweidb` 服务，profile 门控），
      # 默认走服务名解析；把它设成外部地址（如 host.docker.internal）仍可用，
      # 用于连不在本栈里的库。
      MOGO_DATA_BACKEND: ${MOGO_DATA_BACKEND:-mongo}
      PANWEIDB_HOST: ${PANWEIDB_HOST:-panweidb}
      PANWEIDB_PORT: ${PANWEIDB_PORT:-5432}
      PANWEIDB_USER: ${PANWEIDB_USER:-}
      PANWEIDB_PASSWORD: ${PANWEIDB_PASSWORD:-}
      PANWEIDB_DB: ${PANWEIDB_DB:-mogo_dev}
      PANWEIDB_SCHEMA: ${PANWEIDB_SCHEMA:-public}
      ALLOWED_ORIGINS: http://localhost:${MOGO_PORT:-3000}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      FILE_PUBLIC_PATH_PREFIX: /askai-api/api/files
      BACKEND_INTERNAL_BASE_URL: http://chat-api:8000
      ADMIN_API_BASE_URL: http://admin-api:8100
      DOCUMENT_PROCESSING_BASE_URL: http://document-api:8200
      KNOWLEDGE_LOCAL_STORAGE_DIR: /data/knowledge-documents
      TOKEN_USAGE_PUSH_ENABLED: "false"
      AUTO_INSTALL_SYSTEM_DEPS_ON_START: "false"
      AUTO_INSTALL_PLAYWRIGHT_ON_START: "false"
      REQUEST_DEBUG_SNAPSHOT_ENABLED: "false"
      # 默认（单节点模式）：chat-api 直连裸 host。
      # 池化模式（`--profile pool`，自动加载 docker-compose.pool.yml）会用
      # ${DSH_RUNTIME_HOST_URL:-} 把本默认值覆盖掉——未设置该变量时本行留空
      # 即不生效，pool 覆盖文件提供实际值；设置该变量（例如想手动切换拓扑）
      # 时优先于覆盖文件。
      #
      # 单节点模式下不要设置 DSH_RUNTIME_HOSTS_URL；池化模式由 pool 覆盖文件
      # 单独配置。
      DSH_RUNTIME_HOST_URL: ${DSH_RUNTIME_HOST_URL:-http://dsh-runtime-host:8101}
      DSH_RUNTIME_HOSTS_URL: ${DSH_RUNTIME_HOSTS_URL:-}
      # Ownership probe targets（§12.4 option B）。单节点模式下只有一个裸
      # host，没有副本可探测，默认为空；池化模式（`--profile pool`，自动
      # 加载 docker-compose.pool.yml）注入三个副本的 URL，让 chat-api 在 LB
      # 把 session 路由到刚丢副本的副本上时（ring reshuffle、副本重启）
      # 能绕过 LB 直接问每个副本"你持有这个 session 吗"来恢复。
      DSH_RUNTIME_REPLICA_URLS: ${DSH_RUNTIME_REPLICA_URLS:-}
      # Session affinity cache. Needs a Redis URL to leave process memory.
      # 用独立的 Redis DB（默认 DB/1）：它存的是 DSH 运行时锁与归属缓存，与
      # admin-api / document-* 的业务缓存（DB/0）分开。接外部 Redis 时这里
      # 单独给 MOGO_KERNEL_REDIS_URL（含 DB 号），别混用 MOGO_REDIS_URL。
      DSH_KERNEL_REDIS_URL: ${MOGO_KERNEL_REDIS_URL:-redis://redis:6379/1}
      DSH_SESSION_AFFINITY_CACHE_TTL_SECONDS: ${DSH_SESSION_AFFINITY_CACHE_TTL_SECONDS:-7200}
      DSH_TOOL_GATEWAY_URL: http://chat-api:8000/internal/dsh/tools
      DSH_MODEL_GATEWAY_URL: http://chat-api:8000/internal/dsh/model/generate
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - askai-storage:/app/storage
      - knowledge-storage:/data/knowledge-documents
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      # PanWeiDB 走 profile（默认不启动），`required: false` 让 compose 在它未启用时
      # 跳过这个依赖；启用（`--profile panweidb`）时应用会等它 healthy 再起。
      # 注意：不能省 `required: false` —— compose 对「depends_on 指向未启用 profile 的
      # 服务」直接报 `service ... depends on undefined service ...`，整个文件都解析不了。
      panweidb:
        condition: service_healthy
        required: false
      document-api:
        condition: service_healthy
      # chat-api 等待的是它实际连的 Runtime Host。单节点模式（默认）是裸
      # host；池化模式（`--profile pool`）由 docker-compose.pool.yml 的
      # `depends_on` 合并在上面追加 `dsh-runtime-host-lb`。YAML 对
      # depends_on 这类映射按 key 合并，同名 key 后者覆盖前者，所以这里
      # 只写裸 host 不会挡住 pool 覆盖文件的追加。
      dsh-runtime-host:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public
      - backend
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]

  admin-api: &admin-api-def
    image: ${MOGO_ADMIN_API_IMAGE:-ghcr.io/mogoai/admin-api:${MOGO_VERSION:-latest}}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment:
