      document-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public
      - backend
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"]

  document-api: &document-api-def
    image: ${MOGO_DOCUMENT_API_IMAGE:-ghcr.io/mogoai/document-parser:${MOGO_VERSION:-latest}}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    command: ["api"]
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment: &document-environment
      MOGO_DOC_PROCESSING_APP_ENV: production
      MOGO_DOC_PROCESSING_LOCAL_STORAGE_DIR: /data/knowledge-documents
      MOGO_DOC_PROCESSING_REDIS_URL: ${MOGO_REDIS_URL:-redis://redis:6379/0}
      MOGO_DOC_PROCESSING_MONGODB_URI: ${MOGO_MONGODB_URI:-mongodb://mongo:27017}
      MOGO_DOC_PROCESSING_MONGODB_DB: ${MOGO_MONGODB_DB:-mogo_dev}
      # 数据后端开关（MongoDB → PanWeiDB 迁移，见
      # docs/mongo-to-panweidb-migration-plan.md）。默认 mongo，行为不变。
      # PanWeiDB 现在就在本 compose 网络内（`panweidb` 服务，profile 门控），
      # 默认走服务名解析；把它设成外部地址（如 host.docker.internal）仍可用，
      # 用于连不在本栈里的库。
      MOGO_DATA_BACKEND: ${MOGO_DATA_BACKEND:-mongo}
      PANWEIDB_HOST: ${PANWEIDB_HOST:-panweidb}
      PANWEIDB_PORT: ${PANWEIDB_PORT:-5432}
      PANWEIDB_USER: ${PANWEIDB_USER:-}
      PANWEIDB_PASSWORD: ${PANWEIDB_PASSWORD:-}
      PANWEIDB_DB: ${PANWEIDB_DB:-mogo_dev}
      PANWEIDB_SCHEMA: ${PANWEIDB_SCHEMA:-public}
      MOGO_DOC_PROCESSING_WEAVIATE_ENDPOINT: http://weaviate:8080
      MOGO_DOC_PROCESSING_WEAVIATE_COLLECTION_NAME: AskAIKnowledgeChunks
      MOGO_DOC_PROCESSING_WEAVIATE_DISTANCE_METRIC: cosine
      MOGO_DOC_PROCESSING_AZURE_EMBEDDING_ENDPOINT: ${AZURE_EMBEDDING_ENDPOINT:-}
      MOGO_DOC_PROCESSING_AZURE_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_EMBEDDING_DEPLOYMENT_NAME:-text_embedding}
      MOGO_DOC_PROCESSING_AZURE_EMBEDDING_API_VERSION: ${AZURE_EMBEDDING_API_VERSION:-2025-04-01-preview}
      MOGO_DOC_PROCESSING_AZURE_EMBEDDING_API_KEY: ${AZURE_EMBEDDING_API_KEY:-}
      MOGO_DOC_PROCESSING_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - knowledge-storage:/data/knowledge-documents
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      panweidb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public
      - backend
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=3).read()"]

  document-worker:
    image: ${MOGO_DOCUMENT_WORKER_IMAGE:-ghcr.io/mogoai/document-parser:${MOGO_VERSION:-latest}}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    command: ["worker"]
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    environment: *document-environment
    volumes:
      - deployment-secrets:/run/askai-secrets:ro
      - knowledge-storage:/data/knowledge-documents
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      panweidb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public
      - backend

  user-web:
    image: ${MOGO_USER_WEB_IMAGE:-ghcr.io/mogoai/user-web:${MOGO_VERSION:-latest}}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # nginx still needs to bind port 80, which is below the unprivileged range.
    # Grant exactly that one capability instead of running the whole container
    # as root (see apps/user-web/Dockerfile.prod).
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      # nginx keeps its client-body / proxy / cache scratch areas and its log
      # files outside the image rootfs, so with read_only: true they must be
      # explicit tmpfs mounts. Without this nginx exits at startup with
      # `mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)`.
      - /var/cache/nginx:rw,nosuid,nodev,size=128m,mode=0777
      - /var/log/nginx:rw,nosuid,nodev,size=64m,mode=0777
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  admin-web:
    image: ${MOGO_ADMIN_WEB_IMAGE:-ghcr.io/mogoai/admin-web:${MOGO_VERSION:-latest}}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    # 022 US3 (T027): container hardening.
    # - no-new-privileges: a setuid binary inside the container can't escalate
    # - cap_drop ALL: the container starts with zero Linux capabilities
    # - read_only: the image filesystem cannot be modified at runtime, so a
    #   compromise can't drop a backdoor or overwrite a binary
    # - tmpfs /tmp: the only scratch space the process gets (rw, no setuid)
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # nginx still needs to bind port 80, which is below the unprivileged range.
    # Grant exactly that one capability instead of running the whole container
    # as root (see apps/admin-web/Dockerfile).
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      # nginx keeps its client-body / proxy / cache scratch areas and its log
      # files outside the image rootfs, so with read_only: true they must be
      # explicit tmpfs mounts. Without this nginx exits at startup with
      # `mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)`.
      - /var/cache/nginx:rw,nosuid,nodev,size=128m,mode=0777
      - /var/log/nginx:rw,nosuid,nodev,size=64m,mode=0777

    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    image: ${MOGO_GATEWAY_IMAGE:-ghcr.io/mogoai/gateway:${MOGO_VERSION:-latest}}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    # 022 US3 (T027): gateway 是 nginx，同样加固。它还要做 TLS 终结并绑定低
    # 端口，所以保留唯一必要的一项 capability。
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      # nginx keeps its client-body / proxy / cache scratch areas and its log
      # files outside the image rootfs, so with read_only: true they must be
      # explicit tmpfs mounts. Without this nginx exits at startup with
      # `mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)`.
      - /var/cache/nginx:rw,nosuid,nodev,size=128m,mode=0777
      - /var/log/nginx:rw,nosuid,nodev,size=64m,mode=0777

    ports:
      - "${MOGO_PORT:-3000}:80"
      # 022 FR-17 / T037：暴露 443。80 端口的 HTTP 配置会 301 到 HTTPS
      # （见 deploy/docker/nginx-https.conf），生产端口固定为 443。
      # 未切换 TLS 配置时 443 只是空闲监听，不影响 HTTP 访问。
      - "${MOGO_HTTPS_PORT:-443}:443"
    volumes:
      # 022 FR-17 / T037：网关默认启用 TLS（gateway 容器 read_only，无法运行时
      # 生成配置，必须在挂载层切换）。TLS 三步：
      #   1. 证书落到 MOGO_TLS_CERTS_DIR（默认 ./deploy/tls）：
      #      fullchain.pem / privkey.pem。私钥必须 0644：网关以非 root(UID 10001)
      #      运行，Linux 上 bind mount 保留宿主 uid，0600 会让 nginx 启动即
      #      `cannot load certificate key ... (13: Permission denied)`。
      #      ⚠️ 证书不入库（deploy/tls/.gitignore），全新克隆必须先放证书，
      #      否则网关会因缺证书 crash-loop。自签：
      #        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      #          -keyout deploy/tls/privkey.pem -out deploy/tls/fullchain.pem \
      #          -subj "/CN=localhost" \
      #          -addext "subjectAltName = DNS:localhost,IP:127.0.0.1"
      #        chmod 0644 deploy/tls/privkey.pem deploy/tls/fullchain.pem
      #   2. 网关配置的**唯一事实来源**是 deploy/nginx/nginx.conf（TLS 侧），
      #      它也是下面的默认值。（deploy/docker/nginx-https.conf 为兼容入口，
      #      内容等价，由测试钉住。）
      #   3. 改完配置只需重建 gateway 容器，不必重建镜像（配置是挂载进去的）：
      #        MOGO_GATEWAY_IMAGE="$(docker inspect mogo-gateway-1 \
      #          --format '{{.Config.Image}}')" \
      #          docker compose up -d --no-deps gateway
      #      裸 `docker compose up -d gateway` 缺镜像名，会解析成
      #      ghcr.io/mogoai/gateway:latest 去拉远端镜像（可能覆盖本地构建）。
      #      完整步骤见 deploy/tls/README.md。
      # 回退到 HTTP（仅限本地/内网调试）：把 MOGO_NGINX_CONF 指向
      # ./deploy/docker/nginx.conf，或写进 .env 让后续 up 都生效。
      # TLS 侧配置含：HTTP→HTTPS 301（/healthz 豁免）、TLSv1.2/1.3、HSTS、安全响应头。
      - ${MOGO_NGINX_CONF:-./deploy/nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # 024 T039 (FR-020)：灰度分流片段（map + split_clients），canary.sh 按档位覆写
      - ${MOGO_CANARY_NGINX_CONF:-./deploy/canary/nginx-canary.conf}:/etc/nginx/conf.d/mogo-canary.conf:ro
      # TLS certificates — create deploy/tls/ with fullchain.pem and privkey.pem
      - ${MOGO_TLS_CERTS_DIR:-./deploy/tls}:/etc/nginx/certs:ro
    depends_on:
      chat-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      user-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    networks:
      - public
      # backend 用于 /dsh-web/ 反代（转发到 dsh-runtime-host:3080）；
      # dsh-runtime-host 同时挂在 public 网络以访问外部模型 API。
      # 其余上游（user-web/admin-web/admin-api/chat-api）都在 public 网络。
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ─────────────────────────────────────────────────────────────────────────
  # 023 observability-resilience (Phase 1, T009–T013)
  #
  # 可观测性栈：Prometheus / Grafana / Alertmanager / OTel Collector /
  # Tempo / Loki。整段由 `observability` profile 门控（沿用 pool/panweidb
  # 的 profile 先例），默认部署形态不变：`docker compose up` 不带
  # `--profile observability` 时这 6 个服务不会启动，022 锁定的既有
  # 13 服务默认部署假设（024 Assumptions）不被触动。
  #
  # 启用：`docker compose --profile observability up -d`
  #
  # 网络：backend 是 internal: true（纯容器内通信），所以
  #   - grafana 挂 public + backend（浏览器要访问它；backend 内读
  #     prometheus/tempo/loki 数据源）；
  #   - 其余 5 个只挂 backend（抓取目标 chat-api/admin-api/
  #     document-api 都在 backend 内，无需暴露到宿主）。
  #
  # 端口：仅 grafana 暴露宿主端口，默认绑回环 127.0.0.1（同
  # MOGO_PANWEIDB_BIND 的安全惯例；局域网访问显式设
  # MOGO_GRAFANA_BIND=0.0.0.0）。3000 已被 gateway 占用，grafana 默认 3001。
  #
  # 镜像：默认官方 tag + ${MOGO_*_IMAGE} 覆盖口（仓库惯例）。
  #
  # OQ 决策（2026-10-24 Clarify）：OQ-1 日志=Loki；OQ-2 追踪=Tempo
  # （OTLP -> Collector -> Tempo）；OQ-5 告警=Alertmanager -> IM webhook
  # 通知（接收端配置见 deploy/alertmanager/）。
  prometheus:
    image: ${MOGO_PROMETHEUS_IMAGE:-prom/prometheus:v2.53.4}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${MOGO_PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 023 T053/T063–T065：SLO recording rules + 告警规则。
      # prometheus.yml 的 rule_files 指向 /etc/prometheus/rules/*.yml，
      # 早期版本漏了这个挂载 → 规则目录在容器内不存在、规则从未被加载
      # （栈看起来健康，但既没有 SLO 记录也没有任何告警）。
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: ${MOGO_GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${MOGO_GRAFANA_ADMIN_USER:-admin}
      # 生产部署必须通过 .env 覆盖 MOGO_GRAFANA_ADMIN_PASSWORD；默认 admin/admin
      # 仅限本地调试（README 023 节有注明）。
      GF_SECURITY_ADMIN_PASSWORD: ${MOGO_GRAFANA_ADMIN_PASSWORD:-admin}
      # 023 T012：数据源（Prometheus/Loki/Tempo）走文件 provisioning，
      # 不依赖首次进 UI 手建。
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MOGO_GRAFANA_BIND:-127.0.0.1}:${MOGO_GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - public
      - backend

  alertmanager:
    image: ${MOGO_ALERTMANAGER_IMAGE:-prom/alertmanager:v0.27.0}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # 023 T066：通知模板（Runbook / Grafana / Trace 三个排障入口）。
      # alertmanager.yml 的 templates: 指向 /etc/alertmanager/templates/*.tmpl，
      # 早期版本漏了这个挂载 → 模板目录在容器内不存在，通知渲染会失败。
      - ./deploy/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  otel-collector:
    image: ${MOGO_OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.109.0}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      # 业务服务把 OTLP 推到这里；采样率等由 023 T039 的
      # OTEL_SAMPLER_PROBABILITY 在应用侧控制，这里不做二次采样。
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=mogo
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - backend

  tempo:
    image: ${MOGO_TEMPO_IMAGE:-grafana/tempo:2.6.1}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/lib/tempo
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  loki:
    image: ${MOGO_LOKI_IMAGE:-grafana/loki:3.2.1}
    pull_policy: ${MOGO_PULL_POLICY:-missing}
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ── 024 T042 (FR-020)：灰度通道副本 ─────────────────────────────────
  # 默认不启动（profiles: canary）；`mogo canary start` 通过 --profile canary
  # 拉起这些副本。镜像默认走候选 tag（candidate-<sha>），与稳定版并存。
  chat-api-canary:
    <<: *chat-api-def
    image: ${MOGO_CHAT_API_CANARY_IMAGE:-ghcr.io/mogoai/chat-api:${MOGO_CANARY_VERSION:-candidate}}
    profiles: ["canary"]

  admin-api-canary:
    <<: *admin-api-def
    image: ${MOGO_ADMIN_API_CANARY_IMAGE:-ghcr.io/mogoai/admin-api:${MOGO_CANARY_VERSION:-candidate}}
    profiles: ["canary"]

  document-api-canary:
    <<: *document-api-def
    image: ${MOGO_DOCUMENT_API_CANARY_IMAGE:-ghcr.io/mogoai/document-parser:${MOGO_CANARY_VERSION:-candidate}}
    profiles: ["canary"]
volumes:
  # 023 observability 栈（profile: observability）持久化卷，与既有卷同
  # MOGO_VOLUME_PREFIX 前缀约定。
  prometheus-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_prometheus-data
  grafana-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_grafana-data
  alertmanager-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_alertmanager-data
  tempo-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_tempo-data
  loki-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_loki-data

  # Community installations use their own physical volumes. Override the
  # prefix for an isolated validation run without touching another install.
  deployment-secrets:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_deployment-secrets
  mongo-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_mongo-data
  # T101：备份卷。**必须落在加密盘上**（云加密 EBS / LUKS / dm-crypt），
  # compose 无法替宿主加密；做法与校验方式见
  # docs/runbooks/disaster-recovery.md「备份卷加密」。
  mongo-backup:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_mongo-backup
  # PanWeiDB 的 soft/ + data/ 都在这里（旧部署把两者放在容器可写层，`docker rm`
  # 即全丢；这是把它们纳入卷的那次修复）。
  panweidb-storage:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_panweidb-storage
  redis-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_redis-data
  weaviate-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_weaviate-data
  dsh-runtime-data:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_dsh-runtime-data
  # Per-replica storage isolation (§ M1). Each pool replica gets its own
  # volume so kernel state (session JSONL, workspace registry) cannot be
  # written by two replicas at once. Cross-replica recovery of a session
  # whose data lives on another replica's volume goes through the §12.4
  # seed-migration path (probe owner -> export sealed seed -> rebuild), not
  # through reading the JSONL directly.
  dsh-runtime-data-1:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_dsh-runtime-data-1
  dsh-runtime-data-2:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_dsh-runtime-data-2
  dsh-runtime-data-3:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_dsh-runtime-data-3
  askai-storage:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_askai-storage
  knowledge-storage:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_knowledge-storage
  admin-static:
    name: ${MOGO_VOLUME_PREFIX:-mogo}_admin-static

# T102：备份口令。compose 只声明引用关系，**值不在本文件里**。
#
#   * 生产（Swarm）：`docker secret create mongo_backup_passphrase <文件>`
#     然后删掉下面的 file: 行——Swarm 用外部 secret。
#   * 单机 compose：把口令写进宿主机文件（0600、属主 root），再用
#     `MOGO_BACKUP_PASSPHRASE_HOST_FILE` 指过去；默认值故意指向一个
#     **不会被误创建**的路径，缺文件时备份容器起不来——宁可备份停摆并
#     告警，也不要静默降级成无口令备份。
secrets:
  mongo_backup_passphrase:
    file: ${MOGO_BACKUP_PASSPHRASE_HOST_FILE:-./secrets/mongo_backup_passphrase}
  # 024 T074 (FR-039)：副本集内部认证 keyfile。**不提交仓库**，由部署者创建：
  #   mkdir -p secrets && openssl rand -base64 756 | tr -d '\n' > secrets/mongo_keyfile
  #   chmod 600 secrets/mongo_keyfile
  # 仅当启用 `ha` profile（docker compose --profile ha up -d）时才被引用。
  mongo_keyfile:
    file: ${MOGO_MONGO_KEYFILE_HOST_FILE:-./secrets/mongo_keyfile}
networks:
  public:
  backend:
    internal: true
