[pytest]
testpaths = tests
addopts = -q --timeout=120

[coverage:run]
source = app
omit =
    */__init__.py
    */migrations/*
    */main.py

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 38
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.
    if TYPE_CHECKING:
    raise NotImplementedError
