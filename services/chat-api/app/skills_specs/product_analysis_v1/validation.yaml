# Validation contract for the product_analysis_v1 sub-agent.
#
# The parent orchestration (competitor_deep_dive) owns the end-to-end acceptance
# criteria; this file pins the per-node output shape.

skill: product_analysis_v1
role: subagent
parent_skill: competitor_deep_dive
output_key: product_analysis_result

required_sections:
    - Product Overview
    - Feature Matrix
    - Positioning
    - Capability Gaps

must_include_fields:
    - Feature evidence URL
    - Capture timestamp
    - Gap severity

checks:
  - id: sub-1
    criterion: Product Overview
    test: tests/orchestration/test_competitor_deep_dive.py
  - id: sub-2
    criterion: Feature Matrix
    test: tests/orchestration/test_competitor_deep_dive.py
  - id: sub-3
    criterion: Positioning
    test: tests/orchestration/test_competitor_deep_dive.py
  - id: sub-4
    criterion: Capability Gaps
    test: tests/orchestration/test_competitor_deep_dive.py
