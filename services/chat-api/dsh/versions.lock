# MOVO DSH dependency lock policy (format 1)
# Updated for the admitted DSH 0.2.1-rc.2 train on 2026-10-17 (dsh-invariants 保留 0.2.0-rc.2，见下).
# This file records approved direct artifacts; pnpm-lock.yaml and the SBOM pin
# the resolved graph, and the release gate rejects a mixed DSH release train.

[upstream]
repository = "https://github.com/deepseek-ai/deepseek-harness"
reviewed_commit = "0a15e36e7f82b6ed45af6fa9759f29b40dcd965d"
reviewed_commit_root_version = "0.2.1-rc.2"
default_branch = "master"
deploy_from_branch = false
allow_floating_versions = false

# npm metadata does not expose a verified source commit mapping for the
# installable release train, so source-to-package provenance remains explicitly
# unverified until DeepSeek publishes that mapping.
[release_train]
version = "0.2.1-rc.2"
source_mapping = "unverified-by-upstream"
policy = "all @deepseek-ai/dsh and @deepseek-ai/dsh-* packages must resolve exactly to 0.2.1-rc.2"
# 例外：@deepseek-ai/dsh-invariants 未发布 0.2.1-rc.2（npm 上顶版即 0.2.0-rc.2），
# 作为 peer 依赖由消费方(@deepseek-ai/dsh-better-sidebar@0.26.1 / dshmarket)以 ^0.2.0-rc.2
# 声明，0.2.0-rc.2 已满足范围，故保留 0.2.0-rc.2，混用列车已获用户授权。


[[artifact]]
name = "@deepseek-ai/dsh"
version = "0.2.1-rc.2"
registry = "https://registry.npmjs.org"
tarball = "https://registry.npmjs.org/@deepseek-ai/dsh/-/dsh-0.2.1-rc.2.tgz"
integrity = "sha512-tvY+yhfKRifthbqPe/OK0AYxM5ZkvqfYq/jMYgJcEUxiRRL1Vwra3Ti5TB6AXgSWQdiPHYh/Vp6SJa9yHwMNuw=="
shasum = "a502d1551aabc881020e3cb7961c38901565731a"

# 0.2.1-rc.2 train：cordis 直接依赖解析到 4.0.4；cordis-plugin-loader /
# cordis-plugin-include / cordis-plugin-timer 解析到 0.2.0 依赖图中实际钉死
# 版本（见 pnpm-lock.yaml）。cordis-plugin-hmr 在 0.2.0 图中已不再被引用。
[[artifact]]
name = "@deepseek-ai/cordis"
version = "4.0.4"
registry = "https://registry.npmjs.org"
integrity = "PENDING_CI_RECOLLECT"
shasum = "PENDING_CI_RECOLLECT"

[[artifact]]
name = "@deepseek-ai/cordis-plugin-loader"
version = "1.0.5"
registry = "https://registry.npmjs.org"
integrity = "PENDING_CI_RECOLLECT"
shasum = "PENDING_CI_RECOLLECT"

[[artifact]]
name = "@deepseek-ai/cordis-plugin-include"
version = "1.0.9"
registry = "https://registry.npmjs.org"
integrity = "PENDING_CI_RECOLLECT"
shasum = "PENDING_CI_RECOLLECT"

[[artifact]]
name = "@deepseek-ai/cordis-plugin-hmr"
version = "1.0.17"
registry = "https://registry.npmjs.org"
integrity = "PENDING_CI_RECOLLECT"
shasum = "PENDING_CI_RECOLLECT"

[[artifact]]
name = "@deepseek-ai/cordis-plugin-timer"
version = "1.1.6"
registry = "https://registry.npmjs.org"
integrity = "PENDING_CI_RECOLLECT"
shasum = "PENDING_CI_RECOLLECT"

[license_evidence]
license = "MIT"
license_sha256 = "ebb4f09972aee8608be255debaf78451a68e95c290f55c240dec2ecfa16ea6be"
third_party_notices_sha256 = "82211a06d79227912a4ca76d86b7bf5b18ab260515ce4912fd1787d66995a786"

[step_2_requirements]
