# MOGO DSH dependency lock policy (format 1)
# Updated for the admitted DSH 0.2.1-rc.3 train on 2026-10-24 (dsh-invariants 保留 0.2.0-rc.2，见下).
# This file records approved direct artifacts; pnpm-lock.yaml and the SBOM pin
# the resolved graph, and the release gate rejects a mixed DSH release train.

[upstream]
repository = "https://github.com/deepseek-ai/deepseek-harness"
reviewed_commit = "0a15e36e7f82b6ed45af6fa9759f29b40dcd965d"
reviewed_commit_root_version = "0.2.1-rc.3"
default_branch = "master"
deploy_from_branch = false
allow_floating_versions = false

# npm metadata does not expose a verified source commit mapping for the
# installable release train, so source-to-package provenance remains explicitly
# unverified until DeepSeek publishes that mapping.
[release_train]
version = "0.2.1-rc.3"
source_mapping = "unverified-by-upstream"
policy = "all @deepseek-ai/dsh and @deepseek-ai/dsh-* packages must resolve exactly to 0.2.1-rc.3"
# 例外：@deepseek-ai/dsh-invariants 未发布 0.2.1-rc.3（npm 上顶版即 0.2.0-rc.2），
# 作为 peer 依赖由消费方(@deepseek-ai/dsh-better-sidebar@0.26.1 / dshmarket)以 ^0.2.0-rc.2
# 声明，0.2.0-rc.2 已满足范围，故保留 0.2.0-rc.2，混用列车已获用户授权。
# 机器可读白名单：release gate 只认这一行，格式为 "<包名>@<版本>"，逐字匹配。
# 例外必须精确到包名与版本；上游一旦发布同列车版本，此处必须同步删除该条目，
# 否则守卫会因「例外已失效」报错。守卫脚本不依赖 TOML 库，故这里用行内数组。
allowed_mixed_exceptions = ["@deepseek-ai/dsh-invariants@0.2.0-rc.2"]


[[artifact]]
name = "@deepseek-ai/dsh"
version = "0.2.1-rc.3"
registry = "https://registry.npmjs.org"
tarball = "https://registry.npmjs.org/@deepseek-ai/dsh/-/dsh-0.2.1-rc.3.tgz"
integrity = "sha512-H+E9HLnHf7fJqzen84Z9Bq8ggb5xbrcbyhZjXTJLE9NabHr3zteGvTRvdvGkxPl4ov80is4WLglFmSo+/olJjg=="
shasum = "ccc527065b9f736ea299a1f78150a21143d961aa"

