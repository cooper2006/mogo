schema_version: mogo.dsh-compatibility-matrix.v1
active_release:
  dsh_release_train: 0.2.2-rc.1
  node_runtime: "^22.19.0 || >=24.0.0"
  host_protocol: askai.dsh-host.v1
  host_overlay: askai-dsh-host-v1
  execution_projection: askai.execution-v3
  workspace_contract: askai.desktop-workspace-ref.v1
  session_persistence:
    provider: "@deepseek-ai/dsh-session-persistence-jsonl"
    format: opaque-upstream
    resume_probe_required: true
  # 0.1.7-rc.2 起：preset 条目类 `@deepseek-ai/dsh-agent-preset`（AgentPreset）
  # 由 dsh-web-app/presets/*.patch.yml 注册，agentPresets service 由
  # `@deepseek-ai/dsh-agent-preset-registry` 提供。required_presets 保留
  # askai-enterprise + code 两个 ASKAI 直接消费预设；standard/ptc/minimal/cordis
  # 为 registry train 下的上游内置 preset，无需 ASKAI 在 required_presets 中声明。
  # 0.2.2-rc.1 train 沿用同一 preset 机制，未再变更。
  required_presets: [askai-enterprise, code]
  code_model_tools: [read, write, edit, glob, grep, bash, skill, todo_write, subagent]
  code_capabilities:
    - read
    - write
    - edit
    - glob
    - grep
    - bash
    - job_list
    - job_output
    - job_kill
    - skill
    - todo_write
    - subagent
    - web_search
    - web_fetch
  # 0.1.7-rc.2：preset 条目类改由 `@deepseek-ai/dsh-agent-preset` 挂载，
  # agentPresets service 由 `@deepseek-ai/dsh-agent-preset-registry` 提供。
  # 旧 train（0.1.2–0.1.6）的 `@deepseek-ai/dsh-agent-presets` roster 包保留为
  # rollback 兼容性模块，但 active_release 下不再被 host overlay 挂载。
  required_host_modules:
    - "@deepseek-ai/dsh-session"
    - "@deepseek-ai/dsh-session-persistence-jsonl"
    - "@deepseek-ai/dsh-sandbox-local"
    - "@deepseek-ai/dsh-sandbox-policy"
    - "@deepseek-ai/dsh-user-approval"
    - "@deepseek-ai/dsh-tools"
    - "@deepseek-ai/dsh-agent-preset"
    - "@deepseek-ai/dsh-agent-preset-registry"
    - "@deepseek-ai/dsh-ptc-runtime-node"
    - "@deepseek-ai/dsh-workspace"
    - "@deepseek-ai/dsh-host-plugin-inventory"

supported_releases:
  - dsh_release_train: 0.2.2-rc.1
    source_ref: npm dist-tags.latest / next
    node_runtime: "^22.19.0 || >=24.0.0"
    host_protocol: askai.dsh-host.v1
    host_overlay: askai-dsh-host-v1
    old_session_resume: verified
    # 0.2.2-rc.1 通过发布准入门禁（单一列车、供应链哈希、内核握手、
    # SBOM 一致性）后晋升为 production（active_release）；回滚目标为 0.2.1-rc.5。
    status: production
    rollback: 0.2.1-rc.5
  - dsh_release_train: 0.2.1-rc.5
    # 直接回滚目标必须给出 immutable MOGO ref：verify_dsh_rollback_resume.py
    # 用 git archive 从该 ref 还原发布态 Runtime Host，再验证老会话在
    # active train 上恢复。c91dd348 即承载 0.2.1-rc.5 列车的已发布 commit，
    # 对应镜像 ghcr.io/mogoai/dsh-runtime-host:c91dd348。
    source_ref: c91dd348fded8a712ec22bb79cbccb37b79fe266
    node_runtime: "^22.19.0 || >=24.0.0"
    host_protocol: askai.dsh-host.v1
    host_overlay: askai-dsh-host-v1
    old_session_resume: verified
    # 0.2.2-rc.1 晋升 active 后，0.2.1-rc.5 降级为 approved_rollback_target。
    # 其 production 期回归证据见 docs/regression-report-2026-10-01.md。
    status: rollback
    rollback: 0.1.7-rc.2
  - dsh_release_train: 0.1.7-rc.2
    source_ref: pre-release (npm dist-tags.next)
    node_runtime: "^22.19.0 || >=24.0.0"
    host_protocol: askai.dsh-host.v1
    host_overlay: askai-dsh-host-v1
    old_session_resume: verified
    # 0.2.1-rc.5 晋升后降级为 approved_rollback_target，保留更早期回滚链。
    status: rollback
  - dsh_release_train: 0.1.2-alpha.2
    source_ref: 62e054f09aef9e052d424cd904c00a5fd05ea0d6
    node_runtime: "^22.19.0 || >=24.0.0"
    host_protocol: askai.dsh-host.v1
    host_overlay: askai-dsh-host-v1
    old_session_resume: verified
    status: rollback
  - dsh_release_train: 0.1.1-rc.2
    node_runtime: "^22.19.0 || >=24.0.0"
    host_protocol: askai.dsh-host.v1
    host_overlay: askai-dsh-host-v1
    old_session_resume: verified
    status: legacy
  - dsh_release_train: 0.1.0-rc.6
    node_runtime: "^22.19.0 || >=24.0.0"
    host_protocol: askai.dsh-host.v1
    host_overlay: askai-dsh-host-v1
    old_session_resume: verified
    status: legacy

upgrade_policy:
  floating_versions: false
  mutate_installed_runtime_in_place: false
  candidate_requires_full_contract_suite: true
  candidate_requires_packaged_smoke: true
  candidate_requires_old_session_resume: true
  rollback_unit: versioned_container_release
  rollback_preserves_runtime_data: true
  publish_on_failed_admission: false
