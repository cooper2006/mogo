[tool.poetry]
name = "movo-admin-api"
version = "0.2.0"
description = "Control plane API for the MOVO admin system"
authors = ["MOVO Team"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
motor = "2.5.1"
pymongo = "3.13.0"
python-multipart = "^0.0.9"
oss2 = "^2.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^7.0.0"
pytest-asyncio = "^0.23.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/__init__.py",
    "*/migrations/*",
    "*/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 45
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
