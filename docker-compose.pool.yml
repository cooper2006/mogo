# 池化拓扑（opt-in）覆盖文件。
#
# 自动加载：`docker compose --profile pool up` 时，Compose 会按规则自动加载
# `docker-compose.<profile>.yml`（v2.24+ 的 include-by-profile 机制）。
# 单节点模式（默认，无 profile）下此文件不会加载，chat-api 保持指向
# 裸 host（见 docker-compose.yml 的默认 DSH_RUNTIME_HOST_URL）。
#
# 此文件只做两件事：
#   1. 把 chat-api 指向 sticky LB，并配置 ownership probe 的 replica 列表。
#   2. 让 chat-api 额外等待 LB 就绪（depends_on 按 key 合并，不会覆盖
#      主文件里对裸 host 的等待——两种拓扑下各自的等待目标都保留，
#      未启动拓扑下对应服务不参与 condition 判定）。
#
# 用法：
#   docker compose --profile pool up -d
#   # 或 ./mogo up 场景下：
#   docker compose -p mogo --profile pool up -d
#
# 池化模式下不要同时设置 DSH_RUNTIME_HOSTS_URL：chat-api 会用
# sha256 % count 自己算路由，和 nginx 的 consistent hash 不一致，
# 请求会分裂到两套路由上（见 docker-compose.yml 对应注释）。

services:
  chat-api:
    environment:
      DSH_RUNTIME_HOST_URL: ${DSH_RUNTIME_HOST_URL:-http://dsh-runtime-host-lb:8101}
      # Ownership probe targets：故意绕过 LB 直接问每个副本
      # "你持有这个 session 吗"，让 chat-api 在 LB 把 session 路由到
      # 刚丢副本（扩容/缩容、副本重启后的 ring reshuffle）时能恢复。
      DSH_RUNTIME_REPLICA_URLS: ${DSH_RUNTIME_REPLICA_URLS:-http://dsh-runtime-host-1:8101,http://dsh-runtime-host-2:8101,http://dsh-runtime-host-3:8101}
    depends_on:
      dsh-runtime-host-lb:
        condition: service_healthy
