name: Promote Container Candidates

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA whose candidate images should be promoted
        required: true
        type: string
      image_suffixes:
        description: Comma-separated image suffixes from the release manifest
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote validated candidates to latest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_SUFFIXES: ${{ inputs.image_suffixes }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi

          # Images are published as ghcr.io/<owner>/<service>; the repository
          # name is deliberately not part of the image name. This used to be
          # ghcr.io/<owner>/<repository>-<service> (e.g. ghcr.io/mogoai/mogo-chat-api)
          # and must stay in step with container-release.yml and
          # scripts/release/promote_container_release.sh.
          owner="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          owner="${owner,,}"
          candidate_tag="candidate-${SOURCE_SHA,,}"
          IFS=',' read -ra suffixes <<< "$IMAGE_SUFFIXES"

          for suffix in "${suffixes[@]}"; do
            suffix="${suffix//[[:space:]]/}"
            case "$suffix" in
              dsh-runtime-host|chat-api|admin-api|document-parser|user-web|admin-web|gateway) ;;
              *)
                echo "Unsupported image suffix: $suffix" >&2
                exit 2
                ;;
            esac

            image="ghcr.io/${owner}/${suffix}"
            source="${image}:${candidate_tag}"
            target="${image}:latest"
            echo "Promoting ${source} -> ${target}"
            docker buildx imagetools inspect "$source" >/dev/null
            docker buildx imagetools create --tag "$target" "$source"
            docker buildx imagetools inspect "$target"
          done

          # 024 T032 (FR-018)：晋级记录写入发布记录
          git config user.name "mogo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 scripts/release/record_promotion.py \
            --action promote \
            --source-sha "${SOURCE_SHA,,}" \
            --source-tag "${candidate_tag}" \
            --suffixes "${IMAGE_SUFFIXES}" \
            --target-tag latest \
            --actor "${GITHUB_ACTOR:-unknown}"
          git add deploy/releases/
          git commit -m "024 (FR-018): 记录晋级动作 latest（actor=${GITHUB_ACTOR}）" || echo "无记录变更"
          git push origin HEAD:${GITHUB_REF_NAME}
