name: Quality Gate

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  # Release blocker: the version declared in package manifests must match the
  # newest CHANGELOG entry. Without this, tagging v0.2.0 while manifests still
  # say 0.1.0 ships an inconsistent release.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read newest CHANGELOG version
        id: changelog
        run: |
          version=$(grep -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | sed 's/^## v//')
          if [ -z "$version" ]; then
            echo "::error::could not parse a version heading from CHANGELOG.md"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG newest version: $version"

      - name: Compare manifest versions against CHANGELOG
        run: |
          expected="${{ steps.changelog.outputs.version }}"
          failed=0
          check() {
            label="$1"; actual="$2"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$1::$label is $actual but CHANGELOG declares $expected"
              failed=1
            else
              echo "ok  $1 ($label=$actual)"
            fi
          }
          check "services/chat-api/pyproject.toml"    "$(grep -oE '^version = "[^"]+"' services/chat-api/pyproject.toml    | head -1 | grep -oE '[0-9.]+')"
          check "services/admin-api/pyproject.toml"    "$(grep -oE '^version = "[^"]+"' services/admin-api/pyproject.toml    | head -1 | grep -oE '[0-9.]+')"
          check "apps/admin-web/package.json"          "$(node -p "require('./apps/admin-web/package.json').version")"
          check "apps/user-web/package.json"           "$(node -p "require('./apps/user-web/package.json').version")"
          exit $failed

  # Frontend builds and type checks
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/user-web/pnpm-lock.yaml
            apps/admin-web/pnpm-lock.yaml
      - uses: pnpm/action-setup@v6
        with:
          version: "10.14.0"

      - name: Build & typecheck user-web
        working-directory: apps/user-web
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build

      - name: Build & typecheck admin-web
        working-directory: apps/admin-web
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build

      - name: ESLint user-web
        working-directory: apps/user-web
        run: pnpm lint

      - name: ESLint admin-web
        working-directory: apps/admin-web
        run: pnpm lint

      - name: Dependency audit (user-web)
        working-directory: apps/user-web
        run: pnpm audit --production --audit-level high

      - name: Dependency audit (admin-web)
        working-directory: apps/admin-web
        run: pnpm audit --production --audit-level high

  # Backend Python compilation and tests
  backend-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: admin-api
            venv: venv
            python: "3.13"
          - service: chat-api
            venv: venv
            python: "3.13"
          # document-parser ships on Python 3.10 (Docling pinned deps, B7);
          # keep CI isomorphic with the production image.
          - service: document-parser
            venv: .venv
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Compile Python
        working-directory: services/${{ matrix.service }}
        run: python -m compileall -q app

      # Python static correctness (QA R3 leftover #2, landed in QA R5).
      # `compileall` only proves the file parses; this catches duplicate except
      # clauses, duplicate dict keys, and silent broad excepts. Pure stdlib, so
      # it runs before dependency install. Counted ceilings live in
      # scripts/python_static_allowance.json — the gate fails when a count grows.
      - name: Python static correctness
        run: python scripts/check_python_static.py services/${{ matrix.service }}/app --service ${{ matrix.service }}

      # Regression guard for the "implemented + green tests but unreachable in
      # production" class of defect (QA 2026-10-06: the whole 021 layer had zero
      # production imports). Pure stdlib, so it runs before dependency install.
      - name: Production wiring check
        if: matrix.service == 'chat-api'
        working-directory: services/chat-api
        run: python scripts/check_production_wiring.py

      - name: Create venv and install
        working-directory: services/${{ matrix.service }}
        run: |
          python -m venv ${{ matrix.venv }}
          # --require-hashes verifies package integrity (QF-465, B7):
          # all three services now ship hashed, pinned requirements.txt.
          # (requirements-docling.txt is installed only in the Docker image,
          # not here — its Docling tree pins versions but carries no hashes
          # because the CPU-only torch index makes a hash set unusable; see
          # docs/WORK_LOG.md 2026-10-07 probe.)
          ${{ matrix.venv }}/bin/pip install --require-hashes -r requirements.txt
          # pytest-timeout provides the --timeout flag used in "Run tests";
          # without it pytest exits 4 with "unrecognized arguments: --timeout=120".
          ${{ matrix.venv }}/bin/pip install pytest pytest-asyncio pytest-timeout pytest-cov

      # Undefined names (pyflakes F821) — a NameError waiting for the one code
      # path that reaches it. QA R5 found two live instances (a string
      # annotation naming a symbol that was never imported). Only `undefined
      # name` fails the build: the repo carries pre-existing unused imports
      # that are tracked separately and must not mask a real defect here.
      - name: Undefined-name check (pyflakes)
        working-directory: services/${{ matrix.service }}
        run: |
          ${{ matrix.venv }}/bin/pip install -q pyflakes
          out=$(${{ matrix.venv }}/bin/python -m pyflakes app || true)
          if echo "$out" | grep -q "undefined name"; then
            echo "$out" | grep "undefined name"
            echo "::error::pyflakes found undefined name(s)"
            exit 1
          fi
          echo "ok: no undefined names"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          ASKAI_ADMIN_MONGODB_URI: mongodb://127.0.0.1:27017
          ASKAI_ADMIN_MONGODB_DB: mogo_test
          ASKAI_ADMIN_JWT_SECRET: test-secret-key-for-ci
        run: |
          if [[ "${{ matrix.service }}" == "document-parser" ]]; then
            # document-parser's actual coverage is ~40% (tasks/, workers/ untested).
            # Use its own floor from pytest.ini rather than the 55% gate that
            # fits chat-api/admin-api.
            ${{ matrix.venv }}/bin/python -m pytest tests/ --tb=short -q --timeout=120 --cov=app --cov-report=term-missing --cov-report=json --cov-fail-under=40 -m "not dsh_host_e2e"
          else
            ${{ matrix.venv }}/bin/python -m pytest tests/ --tb=short -q --timeout=120 --cov=app --cov-report=term-missing --cov-report=json --cov-fail-under=55 -m "not dsh_host_e2e"
          fi

      # Per-directory / per-file coverage floors for the newer subsystems
      # (017 memory, 021 context space, 009 hooks). The global 55% gate is too
      # coarse for these — they are small, actively changed, and testable.
      - name: Module coverage floors
        if: matrix.service == 'chat-api'
        working-directory: services/chat-api
        run: ${{ matrix.venv }}/bin/python scripts/check_module_coverage.py

  # DSH Runtime Host end-to-end — runs the real Node host as a subprocess.
  # Split from the main gate so "needs a Runtime Host" never masquerades as a
  # regression in the primary test job.
  dsh-host-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/chat-api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install chat-api
        working-directory: services/chat-api
        run: |
          python -m venv venv
          venv/bin/pip install --require-hashes -r requirements.txt
          venv/bin/pip install pytest pytest-asyncio pytest-timeout

      # Mirrors dsh/runtime-host/Dockerfile. This directory is a pnpm workspace
      # with a committed pnpm-lock.yaml, so `npm install` ignored the lockfile
      # and the e2e job exercised a *different* dependency set from the one that
      # ships (QA R5). --frozen-lockfile makes the job fail loudly on drift.
      - name: Install Runtime Host dependencies
        working-directory: services/chat-api/dsh/runtime-host
        run: |
          npm install --global pnpm@10.34.4
          pnpm install --frozen-lockfile

      - name: Run DSH Runtime Host e2e
        working-directory: services/chat-api
        env:
          # The host is probed over loopback; a proxy must not intercept it.
          NO_PROXY: 127.0.0.1,localhost
          no_proxy: 127.0.0.1,localhost
        run: venv/bin/python -m pytest tests/dsh_runtime/ -m dsh_host_e2e -q --tb=short --timeout=300

  # Security checks
  security-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for debug endpoints in production config
        run: |
          echo "Checking main.py for docs_url=None in production..."
          grep -n "docs_url=None\|redoc_url=None\|openapi_url=None" services/admin-api/app/main.py

      - name: Check for global exception handler
        run: |
          echo "Checking for global exception handler..."
          grep -n "global_exception_handler\|exception_handler" services/admin-api/app/main.py

      - name: Check for content type validation
        run: |
          echo "Checking for magic byte validation..."
          grep -n "_validate_content_type\|_MAGIC_BYTE_MAP" services/admin-api/app/api/routes/knowledge_documents.py

      # ── Container image vulnerability scan (QF-460) ────────────────
      # Scans the published candidate images for known CVEs.
      # Full SBOM + provenance scanning happens in container-release.yml.
      - name: Scan Python images with Trivy (CRITICAL + HIGH only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "services/chat-api"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Scan admin-api images with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "services/admin-api"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Scan document-parser images with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "services/document-parser"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"