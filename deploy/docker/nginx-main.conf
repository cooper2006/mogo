# Non-root nginx main config (022 FR-26 / T026).
#
# Diffs from the stock `nginx:1.31.5-alpine` main config:
#   * the `user nginx;` directive is removed — as an unprivileged master it is
#     a no-op at best and an error at worst, and workers already run as the
#     image's `USER`;
#   * `pid` moves to /tmp because /var/run (a symlink to /run) is root-owned
#     755 and a non-root master cannot create its pid file there.
#
# Why this is mandatory for the gateway: Compose runs it with
# `read_only: true` + `cap_drop: ALL`. A root master reading the stock config
# tries to `chown` its cache directories to the `nginx` user, which needs
# CAP_CHOWN — dropped — so nginx dies with
#   `chown("/var/cache/nginx/client_temp", 101) failed (1: Operation not permitted)`
# and the container crash-loops.
#
# Logs and temp dirs stay on their stock paths; the Dockerfile chowns them to
# appuser and Compose mounts them as tmpfs (read_only rootfs).
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_user_agent" '
                      '"$http_referer" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
