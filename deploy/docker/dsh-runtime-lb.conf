# Sticky load balancer for the DSH Runtime Host pool.
#
# A Node Runtime Host keeps kernel session state in process memory, therefore
# every request for one kernel_session_id must reach the same replica. chat-api
# sends the identifier in the X-Session-Id header on each session-scoped call,
# and the consistent hash below pins that session to one upstream.
#
# Requests without X-Session-Id (e.g. /health, runtime-level calls) fall back to
# $request_id so they are still distributed instead of piling onto one host.
#
# See docs/open-source-productization/agent-multi-instance-evaluation.md §3 层 A.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Sticky key resolution, most specific first.
    #
    # A runtime and its sessions live in one replica's memory, so all traffic
    # for a runtime must reach that replica. The **isolation key** is the
    # correct sticky key: it is known before the runtime exists, it is shared
    # by create_runtime and discover_runtime, and chat-api sends it on every
    # runtime- and session-scoped call.
    #
    # The runtime id must NOT be used while an isolation key is present: the
    # two hash to different replicas, so keying on the runtime id sends
    # create_session to a replica that does not own the runtime ("runtime not
    # found"). The runtime/session ids are kept as fallbacks for callers that
    # have no isolation key, and are always forwarded for log correlation.
    #
    # The final fallback is $request_id: it must never be empty, otherwise the
    # hash directive cannot route the request at all.
    map $http_x_isolation_key $dsh_key_isolation {
        default   $http_x_isolation_key;
        ""        "";
    }
    map $http_x_runtime_id $dsh_key_runtime {
        default   $http_x_runtime_id;
        ""        "";
    }
    map $http_x_session_id $dsh_key_session {
        default   $http_x_session_id;
        ""        "";
    }
    map "$dsh_key_isolation:$dsh_key_runtime:$dsh_key_session" $dsh_sticky_key {
        default              $request_id;
        "~^[^:]+:"           $dsh_key_isolation;
        "~^:[^:]+:"          $dsh_key_runtime;
        "~^::.+"             $dsh_key_session;
    }

    upstream dsh_runtime_hosts {
        # Pin one kernel session (or runtime) to one Runtime Host replica.
        hash $dsh_sticky_key consistent;

        server dsh-runtime-host-1:8101 max_fails=3 fail_timeout=10s;
        server dsh-runtime-host-2:8101 max_fails=3 fail_timeout=10s;
        server dsh-runtime-host-3:8101 max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    # Long-lived event streams must not be cut off by proxy timeouts: the SSE
    # subscription stays open for the duration of a session turn.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;

    log_format dsh_lb '$remote_addr "$request" status=$status '
                      'session=$http_x_session_id runtime=$http_x_runtime_id '
                      'isolation=$http_x_isolation_key upstream=$upstream_addr '
                      'key=$dsh_sticky_key';

    server {
        listen 8101;
        access_log /dev/stdout dsh_lb;

        location / {
            proxy_pass http://dsh_runtime_hosts;

            # Forward the auth token and the routing identity unchanged.
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Session-Id $http_x_session_id;
            proxy_set_header X-Runtime-Id $http_x_runtime_id;
            proxy_set_header X-Isolation-Key $http_x_isolation_key;

            # Streaming responses (event-stream) must be flushed immediately.
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
