# ═══════════════════════════════════════════════════════════════════════
# MOGO Gateway — Nginx HTTPS Template
# ═══════════════════════════════════════════════════════════════════════
#
# Usage:
#   1. Copy this file: cp deploy/docker/nginx-https.conf deploy/docker/nginx.conf
#   2. Mount certificates: -v /path/to/certs:/etc/nginx/certs:readonly
#   3. Edit server_name and certificate paths below
#   4. docker compose up -d
#
# Port 80 will redirect all traffic to HTTPS (except /healthz).
#
# ═══════════════════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Health-check stays HTTP for load-balancer probes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;  # CHANGE: your domain, e.g. mogo.example.com

    # ── TLS certificates ─────────────────────────────────────────────
    # CHANGE: mount these via docker-compose volumes
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── Modern TLS hardening ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_early_data on;

    # OCSP stapling (uncomment if using a CA that supports OCSP)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # ── Security headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    absolute_redirect off;
    client_max_body_size 220m;

    # ── Setup / Admin redirects ──────────────────────────────────────
    location = /setup {
        return 302 /admin/setup;
    }

    location = /admin {
        return 302 /admin/;
    }

    # ── Admin web frontend ───────────────────────────────────────────
    location /admin/ {
        proxy_pass http://admin-web/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Admin API ────────────────────────────────────────────────────
    location /admin-api/ {
        proxy_pass http://admin-api:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── Chat API (Agent runtime) ─────────────────────────────────────
    location /askai-api/ {
        proxy_pass http://chat-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── Public API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://chat-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── User web frontend ────────────────────────────────────────────
    location / {
        proxy_pass http://user-web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
