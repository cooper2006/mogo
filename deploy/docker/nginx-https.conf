# ═══════════════════════════════════════════════════════════════════════
# MOGO Gateway — Nginx HTTPS Template
# ═══════════════════════════════════════════════════════════════════════
#
# Usage:
#   1. Copy this file: cp deploy/docker/nginx-https.conf deploy/docker/nginx.conf
#   2. Mount certificates: -v /path/to/certs:/etc/nginx/certs:readonly
#   3. Edit server_name and certificate paths below
#   4. docker compose up -d
#
# Port 80 will redirect all traffic to HTTPS (except /healthz).

# 022 FR-17 / T036：TLS 配置的规范路径是 ``deploy/nginx/nginx.conf``
# （与 tasks.md 一致）。本文件保留为兼容入口，内容与规范文件等价。
# 新部署请直接引用规范路径：
#   MOGO_NGINX_CONF=./deploy/nginx/nginx.conf docker compose up -d
#
# ═══════════════════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── D1 fix (ADR-5 Round1, 2026-10-19): per-request DNS re-resolution ──
# Without `resolver` + a variable-style `proxy_pass`, nginx resolves each
# upstream hostname ONCE at startup and caches the IP forever. When an
# upstream container is recreated (deploy / restart / failover) and gets a
# new IP, every request to that route 502s until the gateway itself is
# restarted. This bit chat-api (/askai-api/*, /api/*) on every chat-api
# recreate. The fix: define upstreams as variables and add `resolver`
# (Docker's embedded DNS at 127.0.0.11) so nginx re-resolves per request.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Health-check stays HTTP for load-balancer probes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────────────
server {
    # nginx ≥1.25.1 起 `listen ... http2` 已弃用（1.31 会打印
    # `the "listen ... http2" directive is deprecated, use the "http2" directive instead`），
    # 改用独立的 http2 指令。
    listen 443 ssl;
    http2 on;
    server_name _;  # CHANGE: your domain, e.g. mogo.example.com

    # ── TLS certificates ─────────────────────────────────────────────
    # Mounted by docker-compose (``MOGO_TLS_CERTS_DIR`` -> /etc/nginx/certs:ro).
    #
    # ⚠️ ``privkey.pem`` 必须对容器内的 uid 10001 可读，即 ``chmod 0644``：网关自
    #    022 FR-26 起以非 root 的 appuser 运行，Linux 上 bind mount 保留宿主 uid，
    #    0600 的私钥容器内读不到 → 启动即
    #      `cannot load certificate key "/etc/nginx/certs/privkey.pem" (13: Permission denied)`。
    #    详见 deploy/tls/README.md。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── Modern TLS hardening ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_early_data on;

    # OCSP stapling (uncomment if using a CA that supports OCSP)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # ── Security headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    absolute_redirect off;
    client_max_body_size 220m;

    # ── Setup / Admin redirects ──────────────────────────────────────
    location = /setup {
        return 302 /admin/setup;
    }

    location = /admin {
        return 302 /admin/;
    }

    # ── Admin web frontend ───────────────────────────────────────────
    location /admin/ {
        set $admin_web_up admin-web;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$admin_web_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Admin API ────────────────────────────────────────────────────
    location /admin-api/ {
        set $admin_api_up admin-api:8100;
        rewrite ^/admin-api/(.*)$ /$1 break;
        proxy_pass http://$admin_api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── Chat API (Agent runtime) ─────────────────────────────────────
    location /askai-api/ {
        set $chat_api_up chat-api:8000;
        rewrite ^/askai-api/(.*)$ /$1 break;
        proxy_pass http://$chat_api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── Public API ───────────────────────────────────────────────────
    location /api/ {
        set $chat_api_up chat-api:8000;
        proxy_pass http://$chat_api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 容器内 dsh web 绑定 127.0.0.1（dsh 官方安全设计，拒绝 0.0.0.0），
    # 不能直接映射到宿主机；通过 gateway 反代暴露。Host 头保留浏览器视角
    # （$http_host）：localhost/127.0.0.1 访问时 dsh 的 browser-trust fence
    # 会识别为 loopback 直接放行；部署到公网域名/内网主机名后，需在
    # dsh-runtime-host 上设置 DSH_WEB_TRUSTED_HOST（逗号分隔 authority）
    # 追加信任，entrypoint 会转成 --trusted-host 参数传给 dsh。
    location /dsh-web/ {
        set $dsh_up dsh-runtime-host:3080;
        rewrite ^/dsh-web/(.*)$ /$1 break;
        proxy_pass http://$dsh_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── User web frontend ────────────────────────────────────────────
    location / {
        set $user_web_up user-web;
        proxy_pass http://$user_web_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
