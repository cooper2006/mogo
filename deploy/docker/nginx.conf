map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── Dynamic upstream resolution (D1 fix) ──────────────────────────────
# Without `resolver` + a variable-style `proxy_pass`, nginx resolves each
# upstream hostname ONCE at worker-start and caches the IP forever. Any
# container restart that changes the upstream's IP (compose networks hand out
# new IPs on recreate) then breaks the route with a steady 502 until the
# gateway itself is restarted. Using a variable target forces per-request
# re-resolution against Docker's embedded DNS (127.0.0.11).
#   - valid=10s: cache each resolved record only 10s so IP changes propagate
#     without a gateway restart.
#   - ipv6=off: this stack is IPv4-only; skip AAAA lookups to avoid the
#     "no resolver defined" / timeout class of failures.
#   - status=...: honour Docker's healthy/degraded records if published.
# 024 T039 (FR-020)：灰度分流片段（map + split_clients），
# 见 deploy/canary/nginx-canary.conf，由 canary.sh 按档位覆写
include /etc/nginx/conf.d/mogo-canary.conf;

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ═══════════════════════════════════════════════════════════════════════
# MOGO Gateway — Nginx Reverse Proxy
# ═══════════════════════════════════════════════════════════════════════
#
# This configuration provides:
#   • Port 80 HTTP proxy (default, for local dev and behind reverse proxies)
#   • Security headers (HSTS, CSP, nosniff, frame-options)
#   • Health-check endpoint (always HTTP, no redirect)
#
# Production TLS setup:
#   1. Copy deploy/docker/nginx-https.conf to deploy/docker/nginx.conf
#   2. Mount your certificate pair at /etc/nginx/certs/
#   3. Update server_name to your domain
#   4. docker compose up -d
#
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 220m;

    # ── Security headers ──────────────────────────────────────────────
    # HSTS — enable after verifying HTTPS works correctly.
    # Uncomment once TLS is configured to enforce HTTPS site-wide.
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    # max-age=0 clears any previously cached HSTS policy (e.g. after disabling TLS).
    add_header Strict-Transport-Security "max-age=0" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Health-check (always HTTP, no redirect) ──────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── Setup / Admin redirects ──────────────────────────────────────
    location = /setup {
        return 302 /admin/setup;
    }

    location = /admin {
        return 302 /admin/;
    }

    # ── Admin web frontend ───────────────────────────────────────────
    location /admin/ {
        set $admin_web_up admin-web;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$admin_web_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Admin API ────────────────────────────────────────────────────
    location /admin-api/ {
        set $admin_api_up admin-api:8100;
        if ($mogo_canary_force = "1") { set $admin_api_up admin-api-canary:8100; }
        if ($mogo_canary_route = "canary") { set $admin_api_up admin-api-canary:8100; }
        rewrite ^/admin-api/(.*)$ /$1 break;
        proxy_pass http://$admin_api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── Chat API (Agent runtime) ─────────────────────────────────────
    location /askai-api/ {
        set $chat_api_up chat-api:8000;
        if ($mogo_canary_force = "1") { set $chat_api_up chat-api-canary:8000; }
        if ($mogo_canary_route = "canary") { set $chat_api_up chat-api-canary:8000; }
        rewrite ^/askai-api/(.*)$ /$1 break;
        proxy_pass http://$chat_api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── Public API ───────────────────────────────────────────────────
    location /api/ {
        set $chat_api_up chat-api:8000;
        if ($mogo_canary_force = "1") { set $chat_api_up chat-api-canary:8000; }
        if ($mogo_canary_route = "canary") { set $chat_api_up chat-api-canary:8000; }
        proxy_pass http://$chat_api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── DSH web frontend ────────────────────────────────────────────
    location /dsh-web/ {
        set $dsh_up dsh-runtime-host:3080;
        rewrite ^/dsh-web/(.*)$ /$1 break;
        proxy_pass http://$dsh_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── User web frontend ────────────────────────────────────────────
    location / {
        set $user_web_up user-web;
        proxy_pass http://$user_web_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
