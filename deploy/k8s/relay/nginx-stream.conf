worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-relay.pid;

events {
    worker_connections 1024;
}

# L4 TCP 透明转发：把容器发布的 3000/8443 转发到 k3s 节点(kiri-k8s)上的 gateway hostPort。
# 3000 -> gateway HTTP(80), 8443 -> gateway HTTPS(443, TLS 在 gateway 终止, 这里仅字节透传)。
#
# ⚠️ 不要写死 k3s 节点的 IP。kiri-k8s 容器重启后 Docker 会重新分配地址，
#    曾因硬编码 172.17.0.4 失效，导致 http://localhost:3000/admin/ 返回
#    ERR_EMPTY_RESPONSE（日志：connect() failed (113) Host is unreachable）。
#    这里改用 Docker 内嵌 DNS + 变量式 proxy_pass：nginx 的 proxy_pass 只有在
#    目标是变量时才走 resolver，每次连接重新解析，valid=10s 控制缓存。
#
# 前置条件：relay 容器必须与 kiri-k8s 处于同一个 user-defined network，
#    否则容器名无法被 Docker DNS 解析（默认 bridge 不支持容器名解析）：
#      docker --context kiri network connect mogo-build-net mogo-gateway-relay
#    容器重建后需重新执行该命令（network connect 是运行时状态，不持久化）。
#
# 8443 现状：gateway Deployment 声明了 containerPort 443 / hostPort 8443，
#    但 gateway-nginx ConfigMap 目前只有 `listen 80` 的 server 块，pod 内没有
#    443 监听，所以 8443 转发会得到 Connection refused。等 gateway 启用 TLS
#    server 后这条链路会自动生效，无需改本文件。
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $remote_addr $k3s_http  { default "kiri-k8s:3000"; }
    map $remote_addr $k3s_https { default "kiri-k8s:8443"; }

    server {
        listen 3000 reuseport;
        proxy_pass $k3s_http;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
    server {
        listen 8443 reuseport;
        proxy_pass $k3s_https;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
