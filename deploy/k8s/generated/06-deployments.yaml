apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-runtime-host
  namespace: mogo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dsh-runtime-host
  template:
    metadata:
      labels:
        app: dsh-runtime-host
    spec:
      containers:
      - name: dsh-runtime-host
        image: ghcr.io/mogoai/dsh-runtime-host:v0.2.8
        ports:
        - containerPort: 3080
          protocol: TCP
        - containerPort: 8101
          protocol: TCP
        envFrom:
        - secretRef:
            name: dsh-runtime-host-env
        volumeMounts:
        - name: vol-deployment-secrets
          mountPath: /run/askai-secrets
          readOnly: true
        - name: vol-dsh-runtime-data
          mountPath: /data/dsh-runtime
        readinessProbe:
          exec: &id001
            command:
            - /bin/sh
            - -c
            - set -a; . /run/askai-secrets/runtime.env; set +a; node -e "fetch('http://127.0.0.1:8101/health',{headers:{authorization:'Bearer
              '+process.env.DSH_RUNTIME_HOST_TOKEN}}).then(r=>{if(!r.ok)process.exit(1);return
              r.json()}).then(v=>{if(v.ok!==true||v.kernel!=='dsh')process.exit(1)}).catch(()=>process.exit(1))"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 20
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 20
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
      volumes:
      - name: vol-deployment-secrets
        persistentVolumeClaim:
          claimName: deployment-secrets
      - name: vol-dsh-runtime-data
        persistentVolumeClaim:
          claimName: dsh-runtime-data
---
