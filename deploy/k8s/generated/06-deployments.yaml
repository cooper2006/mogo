apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mogo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: ghcr.io/mogoai/gateway:v0.2.8
        ports:
        - containerPort: 80
          hostPort: 3000
          protocol: TCP
        - containerPort: 443
          hostPort: 8443
          protocol: TCP
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: canary-conf
          mountPath: /etc/nginx/conf.d/mogo-canary.conf
          subPath: mogo-canary.conf
          readOnly: true
        - name: tls
          mountPath: /etc/nginx/certs
          readOnly: true
        readinessProbe:
          httpGet: &id001
            path: /healthz
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 15
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 15
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
      volumes:
      - name: nginx-conf
        configMap:
          name: gateway-nginx
      - name: canary-conf
        configMap:
          name: gateway-canary
      - name: tls
        secret:
          secretName: gateway-tls
          optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: mogo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      containers:
      - name: admin-api
        image: ghcr.io/mogoai/admin-api:v0.2.8
        ports:
        - containerPort: 8100
          protocol: TCP
        envFrom:
        - secretRef:
            name: admin-api-env
        volumeMounts:
        - name: vol-deployment-secrets
          mountPath: /run/askai-secrets
          readOnly: true
        - name: vol-knowledge-storage
          mountPath: /data/knowledge-documents
        - name: vol-admin-static
          mountPath: /data/admin-static
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8100
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 15
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 15
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
      volumes:
      - name: vol-deployment-secrets
        persistentVolumeClaim:
          claimName: deployment-secrets
      - name: vol-knowledge-storage
        persistentVolumeClaim:
          claimName: knowledge-storage
      - name: vol-admin-static
        persistentVolumeClaim:
          claimName: admin-static
