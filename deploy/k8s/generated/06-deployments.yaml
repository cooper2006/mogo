apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-worker
  namespace: mogo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: document-worker
  template:
    metadata:
      labels:
        app: document-worker
    spec:
      containers:
      - name: document-worker
        image: ghcr.io/mogoai/document-parser:v0.2.8
        args:
        - worker
        envFrom:
        - secretRef:
            name: document-worker-env
        volumeMounts:
        - name: vol-deployment-secrets
          mountPath: /run/askai-secrets
          readOnly: true
        - name: vol-knowledge-storage
          mountPath: /data/knowledge-documents
        readinessProbe:
          exec: &id001
            command:
            - /bin/sh
            - -c
            - celery -A app.workers.celery_app:celery_app inspect ping -d celery@$(hostname)
              --timeout 5 >/dev/null
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 30
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 30
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
      volumes:
      - name: vol-deployment-secrets
        persistentVolumeClaim:
          claimName: deployment-secrets
      - name: vol-knowledge-storage
        persistentVolumeClaim:
          claimName: knowledge-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: mogo
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:8.3.13
        ports:
        - containerPort: 27017
          protocol: TCP
        volumeMounts:
        - name: vol-mongo-data
          mountPath: /data/db
        - name: vol-mongo-backup
          mountPath: /backups
        readinessProbe:
          exec: &id001
            command:
            - mongosh
            - --quiet
            - --eval
            - db.adminCommand('ping').ok
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 15
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 15
      volumes:
      - name: vol-mongo-data
        persistentVolumeClaim:
          claimName: mongo-data
      - name: vol-mongo-backup
        persistentVolumeClaim:
          claimName: mongo-backup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mogo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.2-alpine
        args:
        - redis-server
        - --appendonly
        - 'yes'
        ports:
        - containerPort: 6379
          protocol: TCP
        volumeMounts:
        - name: vol-redis-data
          mountPath: /data
        readinessProbe:
          exec: &id001
            command:
            - redis-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 5
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
          successThreshold: 1
          initialDelaySeconds: 5
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
      volumes:
      - name: vol-redis-data
        persistentVolumeClaim:
          claimName: redis-data
---
