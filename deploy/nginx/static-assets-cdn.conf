# 026 T036 — 静态资源 CDN / 长缓存配置（FR-23）
#
# 供 nginx 或 CDN 源站 include。覆盖 admin-web（/admin/）与 user-web（/）的
# 带 hash 静态产物（js/css/img/woff），以及图片类资源的 WebP 协商。
#
# 关键点：Vite 产物文件名已含 content hash（vite.config.ts 的 chunkFileNames:
# assets/[name]-[hash].js），因此可安全使用 max-age=31536000 + immutable；
# HTML 入口（index.html）**不得**长缓存，交由下游 no-cache 规则处理。

# ── 传输压缩（gzip + brotli）──
gzip on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_vary on;
gzip_types
    text/plain text/css application/json application/javascript
    application/x-javascript text/xml application/xml
    application/xml+rss text/javascript image/svg+xml
    font/woff2;

# brotli 模块如已安装（ngx_brotli），启用；未安装则忽略以下模块加载错误。
# load_module modules/ngx_http_brotli_filter_module.so;
brotli on;
brotli_comp_level 5;
brotli_types text/plain text/css application/json application/javascript image/svg+xml font/woff2;

# ── 带 hash 静态产物：一年长缓存 + immutable ──
location ~* \.(js|mjs|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    add_header Vary "Accept-Encoding";
}

location ~* \.(woff2?|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
}

# ── 图片：WebP 优先 + 一年缓存 + 响应式提示（客户端用 <picture>/srcset 协商）──
location ~* \.(webp|png|jpe?g|gif|svg|avif)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    add_header Vary "Accept";
}

# ── HTML 入口禁止长缓存（避免版本错位）──
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
}

# ── CDN 接入说明 ──
# 若使用阿里云 CDN / Cloudflare：
#   1. 源站填本 nginx（保留上述 Cache-Control 响应头，CDN 直接透传）；
#   2. CDN 侧设置同源 header 回源 + brotli 优先（CDN 缓存键含 Vary: Accept-Encoding）；
#   3. 回源缓存 TTL = 31536000s，忽略源站 Set-Cookie；
#   4. 刷新策略：发布时只刷新 index.html（带 hash 资源天然失效无旧）。
# 以上 header 由源站下发，CDN 无需重复配置压缩级别，保证一致性。