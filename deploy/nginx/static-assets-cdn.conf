# 026 T036 — 静态资源 CDN / 长缓存配置（FR-23）
#
# 供 nginx **server 块内 include**（如 `include /etc/nginx/conf.d/static-assets-cdn.conf;`）。
# 覆盖 admin-web（/admin/）与 user-web 的带 hash 静态产物（js/css/img/woff）
# 与 HTML 入口缓存策略。
#
# 注意：`gzip` / `brotli` 属 http 上下文指令，必须放在 nginx.conf 的 http{} 主配置
# （不在本文件内），避免在 server 上下文 include 时报 "directive is not allowed here"。
#
# 关键点：Vite 产物文件名已含 content hash（vite.config.ts 的 `chunkFileNames:
# assets/[name]-[hash].js`），因此可安全使用 `max-age=31536000` + `immutable`；
# HTML 入口（index.html）**不得**长缓存，交由下方 no-cache 规则处理。

# ── 带 hash 静态产物：一年长缓存 + immutable ──
location ~* \.(js|mjs|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    add_header Vary "Accept-Encoding";
}

location ~* \.(woff2?|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
}

# ── 图片：一年缓存 + 响应式协商（客户端用 <picture>/srcset 选 WebP/AVIF）──
location ~* \.(webp|png|jpe?g|gif|svg|avif)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    add_header Vary "Accept";
}

# ── HTML 入口禁止长缓存（避免版本错位）──
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
}

# ── CDN 接入说明 ──
# 若使用阿里云 CDN / Cloudflare：
#   1. 源站填本 nginx，保留上述 Cache-Control 响应头，CDN 直接透传；
#   2. CDN 缓存键含 `Vary: Accept-Encoding`，CDN 侧按 Accept-Encoding 分副本
#      （brotli 优先，次选 gzip）；源站 nginx.conf http{} 需已开启 gzip/brotli；
#   3. 回源缓存 TTL = 31536000s，忽略源站 Set-Cookie；
#   4. 发布策略：只刷新 index.html（带 hash 资源天然失效无旧）。
# 以上 header 由源站下发，CDN 无需重复配置压缩级别，保证一致性。