# 023 observability-resilience (T013)
# Alertmanager 路由 / 分级 / 静默 / 抑制 + IM webhook 通知。
#
# OQ-5 决策（2026-10-24）：告警渠道 = IM webhook（钉钉/飞书/企业微信，
# 复用 013 特性既有渠道实现）+ 邮件；电话/语音为 Non-Goal；P0 文案
# 必须携带 Grafana 面板链接 + Runbook 链接（T066 的模板负责）。
#
# 启用：`docker compose --profile observability up -d alertmanager`
# prometheus 的 alerting.alertmanagers.stack 指向 alertmanager:9093。
#
# ── 通知渠道占位 ─────────────────────────────────────────────────────
# IM webhook URL 不写死在仓库：通过 compose 环境变量注入到
# receiver 的 webhook config 里（compose 的 configmap 方式）。
# 本地调试可以跑通（没有真实 webhook URL 时 IM 通知会静默失败，
# 不影响栈自身健康）。生产启用渠道：
#   1. 把 deploy/alertmanager/webhook-*.yml 的 URL 指向 013 既有渠道
#      （钉钉/飞书/企业微信的机器人 webhook 端点）；
#   2. 在 alertmanager 的 route 里加 receiver；
#   3. 邮箱通知：SMTP 配置放在 deploy/alertmanager/smtp.env（gitignore），
#      通过 env 注入 alertmanager 镜像的 --web.external-url。
global:
  resolve_timeout: 5m
  # 023 T066 通知模板（Grafana/Runbook/Trace 链接注入）暂以默认
  # 模板渲染；T066 落地后把 templates/ 目录挂进容器并追加：
  #   templates:
  #     - /etc/alertmanager/templates/*.tmpl

route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # 静默（maintenance window）—— 示例见 silences: 段；运行时可用
  # `curl -X POST http://localhost:9093/api/v1/silences` 创建。
  routes:
    # P0（SLO 违约 / /ready 失败）：立即通知 + 分级重复
    - matchers: ['severity="P0"']
      receiver: p0-im-webhook
      repeat_interval: 30m
    # P1（关键路径错误率 / 资源告警降级之外）
    - matchers: ['severity="P1"']
      receiver: p1-im-webhook
    # P2（资源阈值 CPU/内存/磁盘）默认继承最外层 receiver，
    # 不再重复升级 IM 告警，只走 default（debug/邮件兜底）。
  # 抑制：P0 服务不可用时，抑制该服务的 P1/P2 告警（避免同一根因刷屏）
  inhibit_rules:
    - source_matchers: ['severity="P0"']
      target_matchers: ['severity="P1"']
      equal: ["alertname", "service"]
    - source_matchers: ['severity="P0"']
      target_matchers: ['severity="P2"']
      equal: ["service"]

receivers:
  # 默认兜底：生产启用 013 渠道后这里换成真实 webhook/邮件
  # 渠道；默认不写真实 URL，避免误发。
  - name: default
    webhook_configs:
      - url: "http://localhost:9999/alerts"  # 占位（无效地址，本地调试用）

  # P0 IM webhook（钉钉/飞书/企业微信端点）
  - name: p0-im-webhook
    webhook_configs:
      - url: "http://localhost:9999/p0"      # 占位；启用 013 渠道后换成真实 webhook
    webhook_url_template: ""

  # P1 IM webhook
  - name: p1-im-webhook
    webhook_configs:
      - url: "http://localhost:9999/p1"      # 占位；启用 013 渠道后换成真实 webhook

silences: []
