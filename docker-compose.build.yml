services:
  dsh-runtime-host:
    pull_policy: build
    build:
      context: ./services/chat-api/dsh/runtime-host
      dockerfile: Dockerfile
      args:
        MOVO_SECURITY_REFRESH: ${MOVO_SECURITY_REFRESH:-}

  chat-api:
    pull_policy: build
    build:
      context: ./services/chat-api
      dockerfile: Dockerfile
      args:
        INSTALL_SYSTEM_DEPS_AT_BUILD: "true"
        INSTALL_PLAYWRIGHT_AT_BUILD: "true"
        PLAYWRIGHT_WITH_DEPS: "true"
        MOVO_SECURITY_REFRESH: ${MOVO_SECURITY_REFRESH:-}

  admin-api:
    pull_policy: build
    build:
      context: ./services/admin-api
      dockerfile: Dockerfile
      args:
        MOVO_SECURITY_REFRESH: ${MOVO_SECURITY_REFRESH:-}

  # document-api and document-worker are the same image running different
  # commands (["api"] vs ["worker"]) and share the same image name. Only
  # document-api carries the build definition; document-worker reuses that
  # image instead of building the identical context a second time, which
  # previously doubled the slowest target in the build (docling + torch).
  document-api:
    pull_policy: build
    build: &document-build
      context: ./services/document-parser
      dockerfile: Dockerfile
      args:
        INSTALL_SYSTEM_DEPS_AT_BUILD: "true"
        INSTALL_PYTHON_DEPS_AT_BUILD: "true"
        INSTALL_DOCLING_MODELS_AT_BUILD: "true"
        PYTORCH_ACCELERATOR: cpu
        # PyTorch CPU wheels come from a domestic mirror by default; the CPU
        # build is not on PyPI, so this index cannot follow the PyPI mirror.
        PYTORCH_CPU_INDEX_URL: ${PYTORCH_CPU_INDEX_URL:-https://mirror.sjtu.edu.cn/pytorch-wheels/cpu}
        MOVO_SECURITY_REFRESH: ${MOVO_SECURITY_REFRESH:-}
        # Docling downloads its models from HuggingFace when the offline bundle
        # is absent. Default to a domestic mirror so an online build does not
        # stall on huggingface.co; override MOVO_HF_ENDPOINT to point elsewhere.
        MOVO_HF_ENDPOINT: ${MOVO_HF_ENDPOINT:-https://hf-mirror.com}
        MOVO_HF_TIMEOUT: ${MOVO_HF_TIMEOUT:-120}

  document-worker:
    pull_policy: build

  user-web:
    pull_policy: build
    build:
      context: ./apps/user-web
      dockerfile: Dockerfile.prod
      args:
        VITE_ADMIN_WEB_URL: /admin/
        MOVO_SECURITY_REFRESH: ${MOVO_SECURITY_REFRESH:-}

  admin-web:
    pull_policy: build
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /admin/
        VITE_ADMIN_API_BASE_URL: /admin-api
        MOVO_SECURITY_REFRESH: ${MOVO_SECURITY_REFRESH:-}

  gateway:
    pull_policy: build
    build:
      context: ./deploy/docker
      dockerfile: gateway.Dockerfile
      args:
        MOVO_SECURITY_REFRESH: ${MOVO_SECURITY_REFRESH:-}
